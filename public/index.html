<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <title>TIUC: Today is under construction.</title>
  <script>
    (() => {
      const HOME_SEEN_KEY = "tiuc_home_seen";
      const params = new URLSearchParams(location.search);
      const explicitHome = params.get("home") === "1";

      try {
        if (explicitHome) {
          localStorage.setItem(HOME_SEEN_KEY, "1");
          return;
        }

        if (localStorage.getItem(HOME_SEEN_KEY) === "1") {
          location.replace("game.html");
          return;
        }

        localStorage.setItem(HOME_SEEN_KEY, "1");
      } catch {
        // localStorage が使えない場合は通常のトップページ表示を続ける
      }
    })();
  </script>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --ink: #12352a;
      --ink2: #1d4a3a;
      --paper: #fcfbf6;
      --brand: #09804f;
      --brand-dark: #066a41;
      --brand-light: #e3f1ea;
      --brand-light2: #f0f8f4;
      --coral: #d96a4a;
      --coral-light: #fbe9e2;
      --grey: #5f7168;
      --hair: #dce8e1;
      --shadow-sm:
        0 1px 2px rgba(18, 28, 20, 0.04), 0 10px 30px rgba(18, 28, 20, 0.05);
      --shadow-lg: 0 16px 50px rgba(18, 28, 20, 0.1);
      --mono-font: "SFMono-Regular", Consolas, "Courier New", monospace;
    }
    * {
      box-sizing: border-box;
    }
    html {
      background: var(--paper);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        system-ui,
        sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    a {
      color: inherit;
    }
    .shell {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 0 20px;
    }
    #topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 -20px;
      padding: 0 20px;
      background: rgba(252, 251, 246, 0.86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--hair);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      box-shadow: var(--shadow-sm);
    }
    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }
    .brand-copy strong {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .brand-copy span {
      margin-top: 4px;
      color: var(--brand);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      font-family: var(--mono-font);
    }
    #login-link {
      color: var(--grey);
      font-size: 13px;
      text-decoration: none;
      font-weight: 600;
    }
    #login-link:hover {
      color: var(--brand);
    }
    #topbar-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    main {
      padding: 30px 0 56px;
    }
    #hero {
      position: relative;
      overflow: hidden;
      min-height: 440px;
      border-radius: 28px;
      padding: clamp(34px, 6vw, 68px) clamp(22px, 5vw, 60px);
      background: var(--brand);
      box-shadow: var(--shadow-lg);
    }
    #hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at 82% 24%,
        rgba(255, 255, 255, 0.14),
        transparent 42%
      );
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      width: min(62%, 620px);
      min-width: 0;
    }

    .hero-art {
      position: absolute;
      z-index: 2;
      right: clamp(16px, 4vw, 44px);
      bottom: clamp(10px, 3vw, 30px);
      width: min(30%, 300px);
      pointer-events: none;
    }

    .hero-sign {
      position: relative;
      transform: rotate(-3deg);
      filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.35));
    }

    .hero-sign-board {
      position: relative;
      z-index: 2;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 8px;
      padding: 6px;
      overflow: hidden;
    }

    .hero-sign-board img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 3px;
    }

    .hero-sign-legs {
      position: relative;
      height: 34px;
      margin-top: -2px;
    }
    .hero-sign-legs::before,
    .hero-sign-legs::after {
      content: "";
      position: absolute;
      top: 0;
      width: 9px;
      height: 34px;
      background: linear-gradient(90deg, #8a5a2b, #a86e37 60%, #7a4d24);
      border-radius: 0 0 3px 3px;
    }
    .hero-sign-legs::before {
      left: 30%;
      transform: rotate(6deg);
    }
    .hero-sign-legs::after {
      right: 30%;
      transform: rotate(-6deg);
    }

    .hero-sign-ground {
      position: absolute;
      left: 50%;
      bottom: -4px;
      transform: translateX(-50%);
      width: 78%;
      height: 9px;
      background: rgba(0, 0, 0, 0.28);
      border-radius: 50%;
      filter: blur(4px);
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      margin: 0 0 18px;
      color: #bfe6d5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.24em;
      font-family: var(--mono-font);
    }
    #hero h1 {
      position: relative;
      z-index: 1;
      max-width: 100%;
      margin: 0;
      color: #fff;
      font-size: clamp(28px, 5vw, 50px);
      line-height: 1.28;
      letter-spacing: 0.01em;
      font-weight: 800;
    }
    #hero h1 .accent {
      position: relative;
      white-space: normal;
    }
    #hero h1 .accent::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      height: 10px;
      background: rgba(255, 255, 255, 0.35);
      z-index: -1;
    }
    .hero-lead {
      position: relative;
      z-index: 1;
      max-width: 100%;
      margin: 20px 0 0;
      color: #e6f4ec;
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.8;
    }
    #stats-row {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 30px;
    }
    #stats-row .stat {
      min-width: 132px;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
    }
    #stats-row .n {
      font-size: 23px;
      font-weight: 800;
      color: #fff;
    }
    #stats-row .label {
      margin-top: 2px;
      color: #bfe6d5;
      font-size: 11px;
    }
    #buddy {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin-top: 14px;
      min-height: 130px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 24px 28px;
      border: 1px solid var(--brand-dark);
      border-radius: 24px;
      background: linear-gradient(135deg, var(--brand-dark), var(--brand));
      color: #fff;
      text-decoration: none;
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.05),
        0 14px 34px rgba(8, 100, 60, 0.22);
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    #buddy:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.05),
        0 20px 42px rgba(8, 100, 60, 0.3);
    }

    .buddy-icon {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      font-size: 30px;
      line-height: 1;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .buddy-copy {
      position: relative;
      z-index: 2;
      flex: 1;
      min-width: 0;
    }

    .buddy-game {
      color: #fff;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 850;
      line-height: 1.05;
      letter-spacing: -0.025em;
    }

    .buddy-subtitle {
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 13px;
      line-height: 1.45;
    }

    .buddy-arrow {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: var(--brand-dark);
      font-size: 30px;
      line-height: 1;
    }

    .buddy-decoration {
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
    }

    .map-route {
      position: absolute;
      right: 7%;
      bottom: 17%;
      width: 38%;
      height: 42%;
      border-bottom: 3px solid rgba(255, 255, 255, 0.75);
      border-radius: 0 0 55% 45%;
      transform: rotate(-7deg);
    }

    .map-pin {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 4px solid rgba(255, 255, 255, 0.8);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
    }

    .map-pin::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
    }

    .pin-one {
      right: 9%;
      top: 19%;
    }

    .pin-two {
      right: 25%;
      bottom: 20%;
      transform: rotate(-45deg) scale(0.75);
    }

    .pin-three {
      right: 38%;
      top: 26%;
      transform: rotate(-45deg) scale(0.6);
    }

    .firework {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 9px;
      pointer-events: none;
      border-radius: 50%;
      background: currentColor;
      z-index: 6;
      opacity: 0;
      animation: firework-burst 800ms ease-out forwards;
    }

    @keyframes firework-burst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
          scale(0);
      }

      10% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
          scale(1.15);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle))
          translateX(var(--distance)) scale(0.25);
      }
    }

    @media (max-width: 760px) {
      .shell {
        padding: 0 14px;
      }
      #topbar {
        height: 58px;
        margin: 0 -14px;
        padding: 0 14px;
      }
      main {
        padding-top: 16px;
      }
      #hero {
        min-height: 0;
        border-radius: 22px;
        padding: 30px 20px 24px;
      }

      .hero-content {
        width: 100%;
      }

      .hero-art {
        position: relative;
        right: auto;
        bottom: auto;
        width: min(62%, 240px);
        margin: 22px auto 0;
      }

      .hero-sign {
        transform: none;
      }
      .hero-sign-legs,
      .hero-sign-ground {
        display: none;
      }

      #stats-row .stat {
        flex: 1;
        min-width: 0;
        padding: 12px;
      }
      #buddy {
        min-height: 105px;
        gap: 12px;
        padding: 18px;
      }

      .buddy-icon {
        width: 48px;
        height: 48px;
        font-size: 25px;
      }

      .buddy-arrow {
        width: 42px;
        height: 42px;
        font-size: 26px;
      }

      .buddy-subtitle {
        font-size: 11px;
      }
    }
  </style>
  <body>
    <div class="shell">
      <header id="topbar">
        <a href="/?home=1" class="brand" data-i18n-aria-label="index.brand_aria">
          <span class="brand-mark">T</span>
          <span class="brand-copy">
            <strong>TIUC</strong>
            <span>Today is under construction.</span>
          </span>
        </a>
        <div id="topbar-actions">
          <select id="lang-switcher" class="lang-switcher"></select
          ><a id="login-link" href="#" data-i18n="common.login">ログイン</a>
        </div>
      </header>
      <main>
        <section id="hero">
          <div class="hero-content">
            <p class="eyebrow">CIVIC TRANSLATION PROJECT</p>
            <h1 data-i18n-html="index.hero_title">
              街の外国語を、<br /><span class="accent"
                >みんなで少しずつ良くする。</span
              >
            </h1>
            <p class="hero-lead" data-i18n="index.hero_lead">
              気になった外国語表記を撮る。自然かどうかを確かめる。より良い表現を提案する。小さな参加を積み重ねて、街のことばをアップデートします。
            </p>
            <div id="stats-row">
              <div class="stat">
                <div class="n" id="stat-posts">—</div>
                <div class="label" data-i18n="index.stat_posts_label">
                  集まった投稿
                </div>
              </div>
              <div class="stat">
                <div class="n" id="stat-fixed">—</div>
                <div class="label" data-i18n="index.stat_fixed_label">
                  確定した修正
                </div>
              </div>
            </div>
          </div>

          <div class="hero-art">
            <div class="hero-sign">
              <div class="hero-sign-board">
                <img src="images/title-image.png" alt="" aria-hidden="true" />
              </div>
              <div class="hero-sign-legs" aria-hidden="true"></div>
              <div class="hero-sign-ground" aria-hidden="true"></div>
            </div>
          </div>
        </section>
        <a id="buddy" href="game.html">
          <div class="buddy-decoration" aria-hidden="true">
            <span class="map-pin pin-one"></span>
            <span class="map-pin pin-two"></span>
            <span class="map-pin pin-three"></span>
            <span class="map-route"></span>
          </div>

          <div style="padding-bottom:1%;" class="buddy-icon" aria-hidden="true">🎮</div>

          <div class="buddy-copy">
            <div class="buddy-game">Game on</div>
            <div class="buddy-subtitle">
              Start finding and fixing mistranslations!
            </div>
          </div>

          <span style="padding-bottom:1%;" class="buddy-arrow">›</span>
        </a>
      </main>
    </div>
    <script type="module">
      import { getUserId, bootstrapAuth, googleLoginUrl } from "./auth.js";
      import { t, applyI18n, initLangSwitcher } from "./i18n.js";
      applyI18n();
      initLangSwitcher();
      const $ = (id) => document.getElementById(id);
      let userId = getUserId();

      bootstrapAuth().then((r) => {
        userId = r.userId;
        if (r.session) {
          $("login-link").textContent =
            r.session.display_name || t("common.login_active_fallback");
          $("login-link").href = "mypage.html";
        } else {
          $("login-link").href = googleLoginUrl(userId);
        }
      });

      fetch("/api/health")
        .then((r) => r.json())
        .then((j) => {
          if (j.ok) {
            $("stat-posts").textContent = j.total;
            $("stat-fixed").textContent = j.confirmed ?? 0;
          }
        })
        .catch(() => {});

      const buddy = $("buddy");

      function launchBuddyFireworks() {
        const colors = [
          "#ffffff",
          "#ffd34e",
          "#8ee0ad",
          "#82c7ff",
          "#ff9770",
        ];

        const particleCount = 28;

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement("span");
          particle.className = "firework";
          particle.style.color = colors[i % colors.length];
          particle.style.setProperty(
            "--angle",
            `${i * (360 / particleCount)}deg`,
          );
          particle.style.setProperty(
            "--distance",
            `${140 + Math.random() * 100}px`,
          );

          buddy.appendChild(particle);
          particle.addEventListener("animationend", () => particle.remove());
        }
      }

      buddy.addEventListener("click", (event) => {
        if (
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();

        launchBuddyFireworks();

        setTimeout(() => {
          location.href = buddy.href;
        }, 760);
      });
    </script>
  </body>
</html>
