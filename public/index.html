<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <title>TIUC: Today is under construction.</title>
  <script>
    (() => {
      const HOME_SEEN_KEY = "tiuc_home_seen";
      const params = new URLSearchParams(location.search);
      const explicitHome = params.get("home") === "1";

      try {
        if (explicitHome) {
          localStorage.setItem(HOME_SEEN_KEY, "1");
          return;
        }

        if (localStorage.getItem(HOME_SEEN_KEY) === "1") {
          location.replace("game.html");
          return;
        }

        localStorage.setItem(HOME_SEEN_KEY, "1");
      } catch {
        // localStorage が使えない場合は通常のトップページ表示を続ける
      }
    })();
  </script>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --line: #e3e6df;
      --muted: #6b7068;
      --surface: #fff;
      --surface-accent: #edf5ef;
      --text: #1d211d;
      --shadow-sm:
        0 1px 2px rgba(18, 28, 20, 0.04), 0 10px 30px rgba(18, 28, 20, 0.05);
      --shadow-lg: 0 16px 50px rgba(18, 28, 20, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    html {
      background: #f7f8f5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(46, 108, 72, 0.1),
          transparent 28rem
        ),
        linear-gradient(180deg, #fbfcfa 0%, #f5f7f3 100%);
    }
    a {
      color: inherit;
    }
    .shell {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 0 20px;
    }
    #topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--color-accent, #1a5c3a);
      color: #fff;
      font-weight: 800;
      box-shadow: var(--shadow-sm);
    }
    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }
    .brand-copy strong {
      font-size: 15px;
    }
    .brand-copy span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }
    #login-link {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: #3d5145;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }
    #topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    main {
      padding: 30px 0 56px;
    }
    #hero {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(32, 93, 58, 0.1);
      border-radius: 30px;
      padding: clamp(34px, 6vw, 72px) clamp(22px, 7vw, 76px);
      background:
        radial-gradient(
          circle at 88% 16%,
          rgba(255, 255, 255, 0.72),
          transparent 20rem
        ),
        linear-gradient(135deg, #eef6ef 0%, #f8faf5 58%, #eef4f7 100%);
      box-shadow: var(--shadow-lg);
    }
    #hero::after {
      content: "";
      position: absolute;
      right: -90px;
      bottom: -130px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      border: 46px solid rgba(26, 92, 58, 0.055);
      pointer-events: none;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 18px;
      padding: 7px 11px;
      border: 1px solid rgba(26, 92, 58, 0.13);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      color: #356145;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #35a55c;
    }
    #hero h1 {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0;
      font-size: clamp(30px, 5.8vw, 58px);
      line-height: 1.12;
      letter-spacing: -0.045em;
      font-weight: 800;
    }
    #hero h1 .accent {
      color: var(--color-accent, #1a5c3a);
    }
    .hero-lead {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 20px 0 0;
      color: #5f675f;
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.8;
    }
    #stats-row {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 30px;
    }
    #stats-row .stat {
      min-width: 132px;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
    }
    #stats-row .n {
      font-size: 23px;
      font-weight: 800;
    }
    #stats-row .label {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }
    #buddy {
      position: relative;
      overflow: visible;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 88px;
      padding: 18px 22px;
      border: 1px solid #dbe4dc;
      border-radius: 22px;
      background: linear-gradient(110deg, #fff, #f0f6ef);
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    #buddy:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(18, 28, 20, 0.09);
    }

    .buddy-game {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 850;
      letter-spacing: -0.02em;
      color: var(--color-accent, #1a5c3a);
    }

    .buddy-game span {
      margin-left: 6px;
    }

    .firework {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      pointer-events: none;
      border-radius: 50%;
      background: currentColor;
      transform: translate(-50%, -50%);
      animation: firework-burst 520ms ease-out forwards;
      z-index: 5;
    }

    @keyframes firework-burst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
          scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle))
          translateX(var(--distance)) scale(0.35);
      }
    }
    .buddy-arrow {
      font-size: 18px;
      color: #809086;
    }
    @media (max-width: 720px) {
      .shell {
        padding: 0 14px;
      }
      #topbar {
        height: 64px;
      }
      main {
        padding-top: 16px;
      }
      #hero {
        border-radius: 24px;
        padding: 30px 20px 26px;
      }
      #hero h1 {
        font-size: clamp(31px, 10vw, 45px);
      }
      #stats-row .stat {
        flex: 1;
        min-width: 0;
        padding: 12px;
      }
      #buddy {
        padding: 13px 14px;
      }
    }
  </style>
  <body>
    <div class="shell">
      <header id="topbar">
        <a href="/?home=1" class="brand" data-i18n-aria-label="index.brand_aria"
          ><span class="brand-mark">T</span
          ><span class="brand-copy"
            ><strong>TIUC</strong
            ><span>Today is under construction.</span></span
          ></a
        >
        <div id="topbar-actions">
          <select id="lang-switcher" class="lang-switcher"></select
          ><a id="login-link" href="#" data-i18n="common.login">ログイン</a>
        </div>
      </header>
      <main>
        <section id="hero">
          <p class="eyebrow">CIVIC TRANSLATION PROJECT</p>
          <h1 data-i18n-html="index.hero_title">
            街の外国語を、<br /><span class="accent"
              >みんなで少しずつ良くする。</span
            >
          </h1>
          <p class="hero-lead" data-i18n="index.hero_lead">
            気になった外国語表記を撮る。自然かどうかを確かめる。より良い表現を提案する。小さな参加を積み重ねて、街のことばをアップデートします。
          </p>
          <div id="stats-row">
            <div class="stat">
              <div class="n" id="stat-posts">—</div>
              <div class="label" data-i18n="index.stat_posts_label">
                集まった投稿
              </div>
            </div>
            <div class="stat">
              <div class="n" id="stat-fixed">—</div>
              <div class="label" data-i18n="index.stat_fixed_label">
                確定した修正
              </div>
            </div>
          </div>
        </section>
        <a id="buddy" href="game.html">
          <div class="buddy-game">🎮 <span>Game on</span></div>
          <span class="buddy-arrow">›</span>
        </a>
      </main>
    </div>
    <script type="module">
      import { getUserId, bootstrapAuth, googleLoginUrl } from "./auth.js";
      import { t, applyI18n, initLangSwitcher } from "./i18n.js";
      applyI18n();
      initLangSwitcher();
      const $ = (id) => document.getElementById(id);
      let userId = getUserId();

      bootstrapAuth().then((r) => {
        userId = r.userId;
        if (r.session) {
          $("login-link").textContent =
            r.session.display_name || t("common.login_active_fallback");
          $("login-link").href = "mypage.html";
        } else {
          $("login-link").href = googleLoginUrl(userId);
        }
      });

      fetch("/api/health")
        .then((r) => r.json())
        .then((j) => {
          if (j.ok) {
            $("stat-posts").textContent = j.total;
            $("stat-fixed").textContent = j.confirmed ?? 0;
          }
        })
        .catch(() => {});

      const buddy = $("buddy");
      buddy.addEventListener("click", (event) => {
        if (
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();

        const colors = ["#1a5c3a", "#214f69", "#d39426", "#a23a57", "#6d4aa8"];

        for (let i = 0; i < 18; i++) {
          const particle = document.createElement("span");
          particle.className = "firework";
          particle.style.setProperty("--angle", `${i * 20}deg`);
          particle.style.setProperty(
            "--distance",
            `${54 + Math.random() * 44}px`,
          );
          particle.style.color = colors[i % colors.length];
          buddy.appendChild(particle);
          particle.addEventListener("animationend", () => particle.remove());
        }

        setTimeout(() => {
          location.href = buddy.href;
        }, 430);
      });
    </script>
  </body>
</html>
