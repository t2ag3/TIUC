<!doctype html>
<html lang="ja" class="app-html">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <title data-i18n="mypage.title">マイページ - TIUC</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --app-line: #e3e6df;
      --app-muted: #6b7068;
      --app-text: #1d211d;
      --warn: #a33;
      --ok: #161;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
      color: var(--app-text);
    }

    h1 {
      font-size: 21px;
      margin: 0 0 5px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    h2 {
      font-size: 15px;
      margin: 26px 0 10px;
      font-weight: 800;
    }
    .lead {
      color: var(--app-muted);
      font-size: 13px;
      margin: 0 0 18px;
      line-height: 1.7;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--app-line);
      border-radius: 16px;
      padding: 13px;
      text-align: center;
      font: inherit;
      color: inherit;
      background: rgba(255, 255, 255, 0.86);
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.04),
        0 10px 30px rgba(18, 28, 20, 0.05);
    }
    .stat .n {
      font-size: 22px;
      font-weight: 800;
    }
    .stat .label {
      font-size: 12px;
      color: var(--app-muted);
      margin-top: 2px;
    }
    button.stat {
      cursor: pointer;
      transition:
        border-color 0.15s ease,
        transform 0.15s ease;
    }
    button.stat:hover {
      border-color: #b9c3ba;
      transform: translateY(-2px);
    }
    button.stat.active {
      border-color: var(--color-accent, #1a5c3a);
      border-width: 2px;
    }
    button.stat.active .label {
      color: var(--color-accent, #1a5c3a);
      font-weight: 700;
    }
    .card {
      border: 1px solid var(--app-line);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 9px;
      background: rgba(255, 255, 255, 0.8);
    }
    .card .row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--app-line);
      white-space: nowrap;
      font-weight: 600;
    }
    .badge.pending_judgment {
      border-color: var(--color-secondary, #1a4d73);
      color: var(--color-secondary, #1a4d73);
    }
    .badge.needs_fix {
      border-color: var(--warn);
      color: var(--warn);
    }
    .badge.looks_ok {
      border-color: var(--app-muted);
      color: var(--app-muted);
    }
    .badge.confirmed {
      border-color: var(--ok);
      color: var(--ok);
    }
    .badge.adopted {
      border-color: var(--ok);
      color: #fff;
      background: var(--ok);
    }
    .badge.natural {
      border-color: var(--ok);
      color: var(--ok);
    }
    .badge.unnatural {
      border-color: var(--warn);
      color: var(--warn);
    }
    .badge.proposed {
      border-color: var(--color-secondary, #1a4d73);
      color: var(--color-secondary, #1a4d73);
    }
    .badge.rejected {
      border-color: var(--app-muted);
      color: var(--app-muted);
    }
    .memo {
      font-size: 12px;
      margin-top: 6px;
      color: var(--app-muted);
    }
    .ledger-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      padding: 7px 0;
      border-bottom: 1px solid var(--app-line);
      gap: 8px;
    }
    .ledger-row:last-child {
      border-bottom: 0;
    }
    .delta {
      font-weight: 700;
      flex: none;
      color: var(--ok);
    }
    .empty {
      color: var(--app-muted);
      font-size: 13px;
      padding: 12px 0;
    }
    .empty-cta {
      text-align: center;
      border: 1px dashed var(--app-line);
      border-radius: 18px;
      padding: 26px 16px;
      background: rgba(255, 255, 255, 0.6);
    }
    .empty-cta .icon {
      font-size: 30px;
    }
    .empty-cta p {
      font-size: 13px;
      color: var(--app-muted);
      margin: 8px 0 14px;
    }
    .empty-cta a {
      display: inline-block;
      padding: 11px 20px;
      border-radius: var(--radius-pill);
      background: var(--color-accent, #1a5c3a);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .status {
      font-size: 13px;
      color: var(--app-muted);
    }
    .warn {
      color: var(--warn);
    }
    .mono {
      font-family: ui-monospace, monospace;
    }

    #history-list .card {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s ease;
    }
    #history-list .card:hover {
      border-color: #b9c3ba;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 28, 20, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }
    .modal-backdrop[hidden] {
      display: none;
    }
    .modal-card {
      background: #fff;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 18px;
      box-shadow: 0 16px 50px rgba(18, 28, 20, 0.16);
    }
    .modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      border: none;
      background: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--app-muted);
      line-height: 1;
      padding: 4px;
    }
    .modal-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: #eee;
      border-radius: 12px;
      margin-bottom: 12px;
      display: block;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid var(--app-line);
      gap: 12px;
    }
    .detail-row:last-child {
      border-bottom: 0;
    }
    .detail-row span:first-child {
      color: var(--app-muted);
      flex: none;
    }
    .detail-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .detail-actions button {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--app-line);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    .detail-actions button.danger {
      color: var(--warn);
      border-color: var(--warn);
    }
    .detail-msg {
      font-size: 12px;
      margin-top: 8px;
      min-height: 1.2em;
    }

    /* ---- トロフィー ---- */
    .trophies {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .trophies span {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.86);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      border: 1px solid var(--app-line);
    }
    .trophies .locked {
      filter: grayscale(1);
      opacity: 0.4;
    }
    .link-btn {
      display: inline-block;
      border: none;
      background: none;
      padding: 0;
      margin: 0 0 4px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      color: var(--color-accent, #1a5c3a);
      cursor: pointer;
    }

    /* ---- トロフィー詳細モーダル内のクエストカード(game.htmlから移設) ---- */
    .quest {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--app-line);
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 8px;
    }
    .quest.claimed {
      background: #e1e5e0;
      border-color: #c6ccc5;
    }
    .quest.claimed .qt,
    .quest.claimed .qd,
    .quest.claimed .qr {
      opacity: 0.72;
    }
    .quest-icon {
      flex: none;
      font-size: 20px;
      width: 32px;
      text-align: center;
    }
    .quest-body {
      flex: 1;
    }
    .qt {
      font-size: 13px;
      font-weight: 750;
    }
    .qd {
      font-size: 11px;
      color: var(--app-muted);
      margin-top: 3px;
    }
    .qr {
      font-size: 11px;
      color: var(--color-accent, #1a5c3a);
      margin-top: 4px;
    }
    .claim {
      border: 1px solid var(--color-accent, #1a5c3a);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fff;
      color: var(--color-accent, #1a5c3a);
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }
    .claim.ready {
      background: var(--color-accent, #1a5c3a);
      color: #fff;
    }
    .claim:disabled {
      border-color: #ddd;
      color: #aaa;
      background: #f7f7f5;
      cursor: default;
    }
    .celebrate {
      animation: claim-celebrate 550ms ease-out;
    }
    @keyframes claim-celebrate {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 rgba(26, 92, 58, 0);
      }
      35% {
        transform: scale(1.12);
        box-shadow: 0 0 18px rgba(26, 92, 58, 0.45);
      }
      65% {
        transform: scale(0.96);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 rgba(26, 92, 58, 0);
      }
    }
    @keyframes claim-confetti-fire {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
          scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle))
          translateX(var(--distance)) scale(0.3);
      }
    }

    /* ---- 地域インパクト ---- */
    .impact-tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 480px) {
      .impact-tiles {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .impact-tiles .tile {
      text-align: center;
      padding: 12px 4px;
      border: 1px solid var(--app-line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.8);
    }
    .impact-tiles .n {
      font-size: 18px;
      font-weight: 800;
    }
    .impact-tiles .l {
      font-size: 10px;
      color: var(--app-muted);
      margin-top: 2px;
    }

    .sec-sub {
      font-size: 12px;
      color: var(--app-muted);
      margin: -6px 0 12px;
    }

    /* ---- 街ことばコレクション(collection.htmlへのボタン) ---- */
    .collection-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--app-line);
      background: rgba(255, 255, 255, 0.86);
      text-decoration: none;
      color: var(--app-text);
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.04),
        0 10px 30px rgba(18, 28, 20, 0.05);
      transition:
        border-color 0.15s ease,
        transform 0.15s ease;
    }
    .collection-btn:hover {
      border-color: #b9c3ba;
      transform: translateY(-2px);
    }
    .collection-btn-icon {
      flex: none;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--color-accent-soft, #eef5f0);
      font-size: 19px;
    }
    .collection-btn-text {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
    }
    .collection-btn-arrow {
      flex: none;
      font-size: 20px;
      color: var(--app-muted);
    }

    /* ---- マップコレクション ---- */
    #my-map {
      height: 220px;
      border-radius: 16px;
      border: 1px solid var(--app-line);
      overflow: hidden;
    }
    .map-caption {
      font-size: 12px;
      color: var(--app-muted);
      margin-top: 8px;
      text-align: center;
    }
  </style>
  <body class="app-body">
    <div class="app-shell">
      <header class="app-topbar">
        <a href="/" class="brand" data-i18n-aria-label="index.brand_aria"
          ><span class="brand-mark">T</span
          ><span class="brand-copy"
            ><strong>TIUC</strong
            ><span data-i18n="common.back_top">← トップ</span></span
          ></a
        >
        <div id="topbar-actions">
          <select id="lang-switcher" class="lang-switcher"></select>
          <a
            id="login-link"
            href="#"
            class="app-pill-link"
            data-i18n="common.login"
            >ログイン</a
          >
          <a
            id="logout-link"
            href="#"
            class="app-pill-link"
            data-i18n="common.logout"
            hidden
            >ログアウト</a
          >
        </div>
      </header>
      <h1 data-i18n="mypage.h1">マイページ</h1>
      <p class="lead" data-i18n="mypage.lead">これまでの貢献とポイントです。</p>

      <div class="stats" id="stats"></div>

      <h2 data-i18n="mypage.h2_trophies">トロフィー</h2>
      <div class="trophies" id="trophies">
        <div class="empty" data-i18n="common.loading">読み込み中…</div>
      </div>
      <button type="button" id="trophies-more" class="link-btn" data-i18n="mypage.trophies_see_all">
        すべて見る →
      </button>

      <h2 data-i18n="game.collect_title">街ことばコレクション</h2>
      <a class="collection-btn" href="collection.html" id="collection-btn">
        <span class="collection-btn-icon">🐦</span>
        <span class="collection-btn-text" id="collection-btn-label">
          <span data-i18n="mypage.collection_button_prefix">集めたマチコトバ</span>
          (<span id="collection-owned">0</span>/<span id="collection-total">0</span>)
        </span>
        <span class="collection-btn-arrow">›</span>
      </a>

      <h2 data-i18n="game.map_collection_title">マップコレクション</h2>
      <p class="sec-sub" data-i18n="game.map_collection_sub">
        自分が直したスポットが地図に灯ります。
      </p>
      <div class="card">
        <div id="my-map"></div>
        <p class="map-caption" id="map-caption"></p>
      </div>

      <h2 data-i18n="game.impact">地域インパクト</h2>
      <div id="impact">
        <div class="empty" data-i18n="game.impact_empty">
          まだ地域データがありません。
        </div>
      </div>

      <h2 id="history-title" data-i18n="mypage.h2_posts">投稿履歴</h2>
      <div id="history-list"></div>

      <h2 data-i18n="mypage.h2_ledger">ポイント履歴</h2>
      <div id="ledger"></div>

      <p class="status" id="page-status"></p>

      <div id="detail-modal" class="modal-backdrop" hidden>
        <div class="modal-card">
          <button
            type="button"
            id="detail-close"
            class="modal-close"
            data-i18n-aria-label="common.close"
            aria-label="閉じる"
          >
            ×
          </button>
          <img
            id="detail-img"
            data-i18n-alt="mypage.detail_img_alt"
            alt="投稿時の写真"
          />
          <div id="detail-body"></div>
        </div>
      </div>

      <div id="trophy-modal" class="modal-backdrop" hidden>
        <div class="modal-card">
          <button
            type="button"
            id="trophy-close"
            class="modal-close"
            data-i18n-aria-label="common.close"
            aria-label="閉じる"
          >
            ×
          </button>
          <h2 style="margin: 0 0 12px" data-i18n="mypage.h2_trophies">
            トロフィー
          </h2>
          <div id="trophy-list"></div>
        </div>
      </div>
    </div>
    <script type="module">
      import {
        getUserId,
        bootstrapAuth,
        googleLoginUrl,
        logout,
      } from "./auth.js";
      import { t, applyI18n, initLangSwitcher } from "./i18n.js";

      applyI18n();
      initLangSwitcher();

      const $ = (id) => document.getElementById(id);
      let userId = getUserId();
      let posts = [];
      let judgments = [];
      let corrections = [];
      let activeTab = "posts";

      const STATUS_LABEL = {
        pending_judgment: t("mypage.status_pending_judgment"),
        needs_fix: t("mypage.status_needs_fix"),
        looks_ok: t("mypage.status_looks_ok"),
        confirmed: t("mypage.status_confirmed"),
        adopted: t("mypage.status_adopted"),
      };
      const CORRECTION_STATUS_LABEL = {
        proposed: t("mypage.correction_status_proposed"),
        confirmed: t("mypage.correction_status_confirmed"),
        rejected: t("mypage.correction_status_rejected"),
      };
      const LANG_LABEL = {
        "ja-en": t("common.pair_label_en"),
        "ja-zh": t("common.pair_label_zh"),
        "ja-ko": t("common.pair_label_ko"),
        "ja-fr": t("common.pair_label_fr"),
        "ja-es": t("common.pair_label_es"),
        "ja-hi": t("common.pair_label_hi"),
      };
      const jst = (ts) =>
        ts
          ? new Date(ts * 1000).toLocaleString("ja-JP", {
              timeZone: "Asia/Tokyo",
            })
          : "—";

      const POINT_LABEL = {
        post_submit: t("mypage.point_post_submit"),
        judgment: t("common.label_judgment_check"),
        correction_propose: t("common.label_correction_proposal"),
        correction_confirm_bonus: t("mypage.point_correction_confirm_bonus"),
        vote: t("mypage.point_vote"),
        adopt_bonus: t("mypage.point_adopt_bonus"),
        revoke: t("mypage.point_revoke"),
        manual: t("mypage.point_manual"),
      };

      async function load() {
        $("page-status").textContent = t("common.loading");
        const r = await bootstrapAuth();
        userId = r.userId;
        if (r.session) {
          $("login-link").textContent =
            r.session.display_name || t("common.login_active_fallback");
          $("login-link").removeAttribute("href");
          $("logout-link").hidden = false;
        } else {
          $("login-link").href = googleLoginUrl(userId);
          $("logout-link").hidden = true;
        }

        try {
          const res = await fetch(`/api/mypage?user_id=${userId}`);
          const j = await res.json();
          if (!j.ok) throw new Error(j.error || t("common.fetch_error"));
          $("page-status").textContent = "";
          posts = j.posts;
          judgments = j.judgments;
          corrections = j.corrections;
          renderStats(j.summary);
          renderHistory();
          renderLedger(j.point_events);
        } catch (e) {
          $("page-status").innerHTML = `<span class="warn">${e.message}</span>`;
        }

        Promise.all([
          loadTrophies(),
          loadCollection(),
          loadMySpots(),
          loadImpact(),
        ]).catch(console.error);
      }

      // =====================================================================
      // トロフィー(クエスト流用・詳細はモーダルでもう一段深く)
      // 街ことばコレクション・マップコレクション・地域インパクト
      // =====================================================================
      let quests = [];

      async function loadTrophies() {
        const j = await fetch(`/api/game/quests?user_id=${userId}`).then(
          (r) => r.json(),
        );
        if (!j.ok) return;
        quests = j.quests;
        $("trophies").innerHTML = quests
          .map(
            (q) =>
              `<span class="${q.claimed ? "" : "locked"}" title="${t(`game.quest.${q.id}.title`)}">${q.icon}</span>`,
          )
          .join("");
      }

      function celebrateButton(button) {
        if (!button) return;
        button.classList.remove("celebrate");
        void button.offsetWidth;
        button.classList.add("celebrate");
        button.addEventListener(
          "animationend",
          () => button.classList.remove("celebrate"),
          { once: true },
        );
      }

      function launchButtonFirework(x, y) {
        const colors = [
          "#1a5c3a",
          "#214f69",
          "#d39426",
          "#a23a57",
          "#6d4aa8",
          "#e56d35",
        ];
        for (let i = 0; i < 16; i++) {
          const particle = document.createElement("span");
          particle.style.position = "fixed";
          particle.style.zIndex = "220";
          particle.style.width = "7px";
          particle.style.height = "7px";
          particle.style.borderRadius = "50%";
          particle.style.pointerEvents = "none";
          particle.style.left = `${x}px`;
          particle.style.top = `${y}px`;
          particle.style.color = colors[i % colors.length];
          particle.style.background = "currentColor";
          particle.style.setProperty("--angle", `${i * (360 / 16)}deg`);
          particle.style.setProperty(
            "--distance",
            `${32 + Math.random() * 34}px`,
          );
          particle.style.animation =
            "claim-confetti-fire 700ms ease-out forwards";
          document.body.appendChild(particle);
          particle.addEventListener("animationend", () => particle.remove());
        }
      }

      function launchClaimPopper(sourceEl) {
        if (!sourceEl) return;
        const rect = sourceEl.getBoundingClientRect();
        const centerY = rect.top + rect.height / 2;
        launchButtonFirework(rect.left - 18, centerY);
        launchButtonFirework(rect.right + 18, centerY);
      }

      function renderTrophyList() {
        $("trophy-list").innerHTML = quests
          .map((q) => {
            const title = t(`game.quest.${q.id}.title`);
            const desc = t(`game.quest.${q.id}.desc`);
            const buttonText = q.claimed
              ? t("game.quest_claimed")
              : q.done
                ? t("game.quest_claim")
                : t("game.quest_incomplete");
            return `
              <div class="quest ${q.claimed ? "claimed" : ""}">
                <div class="quest-icon">${q.icon}</div>
                <div class="quest-body">
                  <div class="qt">${title}</div>
                  <div class="qd">${desc}</div>
                  <div class="qr">+${q.reward} XP</div>
                </div>
                <button
                  class="claim ${q.done && !q.claimed ? "ready" : ""}"
                  data-id="${q.id}"
                  ${!q.done || q.claimed ? "disabled" : ""}
                >${buttonText}</button>
              </div>
            `;
          })
          .join("");

        $("trophy-list")
          .querySelectorAll(".claim.ready")
          .forEach((b) =>
            b.addEventListener("click", async () => {
              celebrateButton(b);
              launchClaimPopper(b);
              b.disabled = true;
              const r = await fetch("/api/game/quests/claim", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({
                  user_id: userId,
                  quest_id: b.dataset.id,
                }),
              }).then((x) => x.json());
              if (r.ok) {
                await loadTrophies();
                renderTrophyList();
              } else {
                b.disabled = false;
              }
            }),
          );
      }

      $("trophies-more").addEventListener("click", () => {
        renderTrophyList();
        $("trophy-modal").hidden = false;
      });
      $("trophy-close").addEventListener("click", () => {
        $("trophy-modal").hidden = true;
      });
      $("trophy-modal").addEventListener("click", (e) => {
        if (e.target === $("trophy-modal")) $("trophy-modal").hidden = true;
      });

      async function loadImpact() {
        const j = await fetch(`/api/game/impact?user_id=${userId}`).then(
          (r) => r.json(),
        );
        if (!j.ok || !j.region) {
          $("impact").innerHTML = `<div class="empty">${t("game.impact_empty")}</div>`;
          return;
        }
        const x = j.region;
        $("impact").innerHTML = `
          <div class="impact-tiles">
            <div class="tile"><div class="n">${x.posts || 0}</div><div class="l">${t("game.impact_posts")}</div></div>
            <div class="tile"><div class="n">${x.confirmed || 0}</div><div class="l">${t("game.impact_confirmed")}</div></div>
            <div class="tile"><div class="n">${x.adopted || 0}</div><div class="l">${t("game.impact_adopted")}</div></div>
            <div class="tile"><div class="n">${t("game.rank_value", { rank: x.rank })}</div><div class="l">${t("game.impact_rank")}</div></div>
          </div>
        `;
      }

      async function loadCollection() {
        const j = await fetch(`/api/game/collection?user_id=${userId}`).then(
          (r) => r.json(),
        );
        if (!j.ok) return;
        const owned = j.species.filter((s) => s.count > 0).length;
        $("collection-owned").textContent = owned;
        $("collection-total").textContent = j.species.length;
      }

      let leafletPromise = null;
      function loadLeaflet() {
        if (leafletPromise) return leafletPromise;
        leafletPromise = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
          s.onload = resolve;
          s.onerror = () => reject(new Error(t("common.map_load_error")));
          document.head.appendChild(s);
        });
        return leafletPromise;
      }

      async function loadMySpots() {
        const j = await fetch(`/api/game/map-spots?user_id=${userId}`).then(
          (r) => r.json(),
        );
        if (!j.ok) return;

        $("map-caption").innerHTML = t("game.map_area_count", {
          n: j.area_count,
        });

        if (!j.spots.length) {
          $("my-map").innerHTML =
            `<div class="empty" style="padding:80px 0;text-align:center">${t("game.map_collection_empty")}</div>`;
          return;
        }

        try {
          await loadLeaflet();
        } catch {
          return;
        }

        const map = L.map("my-map", {
          zoomControl: false,
          attributionControl: false,
        });
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
        }).addTo(map);

        const bounds = [];
        for (const s of j.spots) {
          const color = s.status === "adopted" ? "#1a4d73" : "#2e6da4";
          L.circleMarker([s.lat, s.lng], {
            radius: 6,
            fillColor: color,
            fillOpacity: 1,
            color: "#fff",
            weight: 1.5,
          }).addTo(map);
          bounds.push([s.lat, s.lng]);
        }
        map.fitBounds(bounds, { padding: [20, 20], maxZoom: 15 });
      }

      function renderStats(s) {
        $("stats").innerHTML = `
    <div class="stat"><div class="n">${s.points_total}</div><div class="label">${t("mypage.stat_points", { level: s.level })}</div></div>
    <button type="button" class="stat" data-tab="posts"><div class="n">${s.post_count}</div><div class="label">${t("mypage.stat_posts")}</div></button>
    <button type="button" class="stat" data-tab="judgments"><div class="n">${s.judged_count}</div><div class="label">${t("common.label_judgment_check")}</div></button>
    <button type="button" class="stat" data-tab="corrections"><div class="n">${s.corrected_count}</div><div class="label">${t("common.label_correction_proposal")}</div></button>`;
        $("stats")
          .querySelectorAll(".stat[data-tab]")
          .forEach((btn) => {
            btn.addEventListener("click", () => {
              activeTab = btn.dataset.tab;
              renderHistory();
            });
          });
      }

      const HISTORY_TITLE_KEY = {
        posts: "mypage.h2_posts",
        judgments: "mypage.h2_judgments",
        corrections: "mypage.h2_corrections",
      };
      function renderHistory() {
        $("history-title").textContent = t(HISTORY_TITLE_KEY[activeTab]);
        $("stats")
          .querySelectorAll(".stat[data-tab]")
          .forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.tab === activeTab);
          });
        if (activeTab === "posts") renderPosts();
        else if (activeTab === "judgments") renderJudgments();
        else renderCorrections();
      }

      function renderPosts() {
        const el = $("history-list");
        if (!posts.length) {
          el.innerHTML = `<div class="empty-cta">
      <p class="icon">📷</p>
      <p>${t("mypage.posts_empty_text")}</p>
      <a href="report.html">${t("mypage.posts_empty_cta")}</a>
    </div>`;
          return;
        }
        el.innerHTML = posts
          .map(
            (p) => `
    <div class="card" data-id="${p.id}">
      <div class="row1">
        <span>${LANG_LABEL[p.lang_pair] || p.lang_pair} ・ ${jst(p.created_at)}</span>
        <span class="badge ${p.status}">${STATUS_LABEL[p.status] || p.status}</span>
      </div>
      ${p.situation ? `<p class="memo">${escapeHtml(p.situation)}</p>` : ""}
    </div>
  `,
          )
          .join("");
        el.querySelectorAll(".card").forEach((card) => {
          card.addEventListener("click", () =>
            openDetail("post", card.dataset.id),
          );
        });
      }

      function renderJudgments() {
        const el = $("history-list");
        if (!judgments.length) {
          el.innerHTML = `<div class="empty-cta">
      <p class="icon">🔍</p>
      <p>${t("mypage.judgments_empty_text")}</p>
      <a href="judge.html">${t("mypage.judgments_empty_cta")}</a>
    </div>`;
          return;
        }
        el.innerHTML = judgments
          .map(
            (j, i) => `
    <div class="card" data-idx="${i}">
      <div class="row1">
        <span>${LANG_LABEL[j.lang_pair] || j.lang_pair} ・ ${jst(j.created_at)}</span>
        <span class="badge ${j.verdict}">${j.verdict === "natural" ? t("mypage.verdict_natural") : t("mypage.verdict_unnatural")}</span>
      </div>
      ${j.situation ? `<p class="memo">${escapeHtml(j.situation)}</p>` : ""}
    </div>
  `,
          )
          .join("");
        el.querySelectorAll(".card").forEach((card) => {
          card.addEventListener("click", () =>
            openDetail("judgment", judgments[Number(card.dataset.idx)]),
          );
        });
      }

      function renderCorrections() {
        const el = $("history-list");
        if (!corrections.length) {
          el.innerHTML = `<div class="empty-cta">
      <p class="icon">✏️</p>
      <p>${t("mypage.corrections_empty_text")}</p>
      <a href="curate.html">${t("mypage.corrections_empty_cta")}</a>
    </div>`;
          return;
        }
        el.innerHTML = corrections
          .map(
            (c, i) => `
    <div class="card" data-idx="${i}">
      <div class="row1">
        <span>${LANG_LABEL[c.lang_pair] || c.lang_pair} ・ ${jst(c.created_at)}</span>
        <span class="badge ${c.correction_status}">${CORRECTION_STATUS_LABEL[c.correction_status] || c.correction_status}</span>
      </div>
      <p class="memo">${c.verdict === "no_issue" ? t("mypage.no_issue_ruling") : escapeHtml(c.fixed_text || "")}</p>
    </div>
  `,
          )
          .join("");
        el.querySelectorAll(".card").forEach((card) => {
          card.addEventListener("click", () =>
            openDetail("correction", corrections[Number(card.dataset.idx)]),
          );
        });
      }

      function renderLedger(events) {
        const el = $("ledger");
        if (!events.length) {
          el.innerHTML = `<p class="empty">${t("mypage.ledger_empty")}</p>`;
          return;
        }
        el.innerHTML = events
          .map(
            (e) => `
    <div class="ledger-row">
      <span>${POINT_LABEL[e.kind] || e.kind} ・ ${jst(e.created_at)}</span>
      <span class="delta">+${e.points}</span>
    </div>
  `,
          )
          .join("");
      }

      function openDetail(kind, data) {
        if (kind === "post") return openPostDetail(data);
        if (kind === "judgment") return openJudgmentDetail(data);
        return openCorrectionDetail(data);
      }

      function openPostDetail(id) {
        const p = posts.find((x) => x.id === id);
        if (!p) return;
        $("detail-img").src =
          `/img/${p.src_thumb_key}?user_id=${encodeURIComponent(userId)}`;
        $("detail-body").innerHTML = `
    <div class="detail-row"><span>${t("mypage.row_lang")}</span><span>${LANG_LABEL[p.lang_pair] || p.lang_pair}</span></div>
    <div class="detail-row"><span>${t("mypage.row_status")}</span><span>${STATUS_LABEL[p.status] || p.status}</span></div>
    <div class="detail-row"><span>${t("mypage.row_original")}</span><span>${escapeHtml(p.original_text || "—")}</span></div>
    <div class="detail-row"><span>${t("mypage.row_translated")}</span><span>${escapeHtml(p.translated_text || "—")}</span></div>
    <div class="detail-row"><span>${t("mypage.row_created_at")}</span><span>${jst(p.created_at)}</span></div>
    ${p.situation ? `<div class="detail-row"><span>${t("mypage.row_memo")}</span><span>${escapeHtml(p.situation)}</span></div>` : ""}
    ${
      p.status === "pending_judgment"
        ? `
      <div class="detail-actions">
        <button type="button" class="danger" id="detail-delete">${t("mypage.delete_btn")}</button>
      </div>
      <p class="detail-msg" id="detail-msg"></p>
    `
        : ""
    }
  `;
        $("detail-modal").hidden = false;

        const delBtn = document.getElementById("detail-delete");
        if (delBtn) {
          delBtn.addEventListener("click", async () => {
            delBtn.disabled = true;
            const msg = document.getElementById("detail-msg");
            msg.textContent = t("mypage.deleting");
            try {
              const res = await fetch("/api/posts/delete", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ user_id: userId, post_id: p.id }),
              });
              const j = await res.json();
              if (!j.ok) throw new Error(j.error);
              $("detail-modal").hidden = true;
              load();
            } catch (e) {
              msg.innerHTML = `<span class="warn">${e.message}</span>`;
              delBtn.disabled = false;
            }
          });
        }
      }

      function openJudgmentDetail(j) {
        $("detail-img").src =
          `/img/${j.src_thumb_key}?judge_id=${encodeURIComponent(userId)}`;
        $("detail-body").innerHTML = `
    <div class="detail-row"><span>${t("mypage.row_lang")}</span><span>${LANG_LABEL[j.lang_pair] || j.lang_pair}</span></div>
    <div class="detail-row"><span>${t("mypage.row_verdict")}</span><span>${j.verdict === "natural" ? t("mypage.verdict_natural") : t("mypage.verdict_unnatural")}</span></div>
    <div class="detail-row"><span>${t("mypage.row_status")}</span><span>${STATUS_LABEL[j.post_status] || j.post_status}</span></div>
    <div class="detail-row"><span>${t("mypage.row_created_at")}</span><span>${jst(j.created_at)}</span></div>
    ${j.situation ? `<div class="detail-row"><span>${t("mypage.row_memo")}</span><span>${escapeHtml(j.situation)}</span></div>` : ""}
  `;
        $("detail-modal").hidden = false;
      }

      function openCorrectionDetail(c) {
        $("detail-img").src =
          `/img/${c.src_image_key}?curator_id=${encodeURIComponent(userId)}`;
        $("detail-body").innerHTML = `
    <div class="detail-row"><span>${t("mypage.row_lang")}</span><span>${LANG_LABEL[c.lang_pair] || c.lang_pair}</span></div>
    <div class="detail-row"><span>${t("mypage.row_correction_status")}</span><span>${CORRECTION_STATUS_LABEL[c.correction_status] || c.correction_status}</span></div>
    <div class="detail-row"><span>${t("mypage.row_original")}</span><span>${escapeHtml(c.original_text || "—")}</span></div>
    ${
      c.verdict === "no_issue"
        ? `<div class="detail-row"><span>${t("mypage.row_verdict")}</span><span>${t("mypage.no_issue_ruling")}</span></div>`
        : `<div class="detail-row"><span>${t("mypage.row_fixed_text")}</span><span>${escapeHtml(c.fixed_text || "—")}</span></div>`
    }
    ${c.explanation ? `<div class="detail-row"><span>${t("mypage.row_explanation")}</span><span>${escapeHtml(c.explanation)}</span></div>` : ""}
    <div class="detail-row"><span>${t("mypage.row_created_at")}</span><span>${jst(c.created_at)}</span></div>
  `;
        $("detail-modal").hidden = false;
      }

      $("logout-link").addEventListener("click", async (e) => {
        e.preventDefault();
        await logout();
        location.reload();
      });

      $("detail-close").addEventListener("click", () => {
        $("detail-modal").hidden = true;
      });
      $("detail-modal").addEventListener("click", (e) => {
        if (e.target === $("detail-modal")) $("detail-modal").hidden = true;
      });

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      load();
    </script>
  </body>
</html>
