<!doctype html>
<html lang="ja" class="app-html">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <title data-i18n="curate.title">修正・投票 - TIUC</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --app-line: #e3e6df;
      --app-muted: #6b7068;
      --app-text: #1d211d;
      --warn: #a33;
      --ok: #161;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
      color: var(--app-text);
    }
    #points-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-width: max-content;
      white-space: nowrap;
      font-size: 12px;
      border: 1px solid var(--app-line);
      border-radius: var(--radius-pill);
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.6);
      font-weight: 700;
    }
    h1 {
      font-size: 21px;
      margin: 0 0 5px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .lead {
      color: var(--app-muted);
      font-size: 13px;
      margin: 0 0 14px;
      line-height: 1.7;
    }

    .row-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    #other-lang-wrap {
      margin-bottom: 16px;
    }

    #other-lang-wrap[hidden] {
      display: none;
    }

    #other-lang {
      width: 100%;
      padding: 10px;
      font: inherit;
      border: 1px solid var(--app-line);
      border-radius: var(--radius-sm);
      background: #fff;
    }
    .row-select button {
      flex: 1;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--app-line);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      white-space: nowrap;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }
    .row-select button:hover {
      border-color: #b9c3ba;
    }
    .row-select button.active {
      background: var(--color-accent, #1a5c3a);
      color: #fff;
      border-color: var(--color-accent, #1a5c3a);
    }
    #tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    #tabs button {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--app-line);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }
    #tabs button.active {
      background: #1d211d;
      color: #fff;
      border-color: #1d211d;
    }

    .panel[hidden] {
      display: none;
    }
    #card,
    #vote-card {
      border: 1px solid var(--app-line);
      border-radius: 22px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.04),
        0 10px 30px rgba(18, 28, 20, 0.05);
    }
    #card[hidden],
    #vote-card[hidden] {
      display: none;
    }
    .imgs {
      display: flex;
      gap: 8px;
    }
    .imgs > div {
      flex: 1;
    }
    .imgs img {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: 14px;
      background: #f2f2f0;
      display: block;
    }
    .imgs .cap {
      font-size: 11px;
      color: var(--app-muted);
      text-align: center;
      margin-top: 4px;
    }
    .meta {
      font-size: 12px;
      color: var(--app-muted);
      margin: 10px 0;
    }

    label.field {
      display: block;
      font-size: 12px;
      color: var(--app-muted);
      margin: 10px 0 3px;
    }
    input[type="text"],
    textarea {
      width: 100%;
      font-size: 14px;
      padding: 9px 10px;
      border: 1px solid var(--app-line);
      border-radius: 10px;
      font-family: inherit;
    }
    .verdict-row {
      display: flex;
      gap: 8px;
      margin: 10px 0;
    }
    .verdict-row label {
      flex: 1;
      border: 1px solid var(--app-line);
      border-radius: var(--radius-sm);
      padding: 10px;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      position: relative;
    }
    .verdict-row input {
      position: absolute;
      opacity: 0;
    }
    .verdict-row label:has(input:checked) {
      border-color: var(--color-accent, #1a5c3a);
      border-width: 2px;
      background: var(--color-accent-soft, #eef5f0);
      font-weight: 700;
    }
    #submit-fix {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      font-size: 15px;
      border: 0;
      border-radius: 14px;
      background: var(--color-accent, #1a5c3a);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #submit-fix:hover:not(:disabled) {
      background: var(--color-accent-dark, #164a30);
    }
    #submit-fix:disabled {
      background: #c3c9c2;
      cursor: default;
    }
    .skip-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 12px;
      padding: 13px 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--app-muted);
      background: rgba(107, 112, 104, 0.06);
      border: 2px dashed var(--app-line);
      border-radius: 16px;
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }
    .skip-btn:hover {
      background: rgba(107, 112, 104, 0.1);
      border-color: #b9c3ba;
    }
    .skip-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .fixed-box {
      background: var(--color-accent-soft, #eef5f0);
      border: 1px solid #cfe3d8;
      border-radius: 12px;
      padding: 11px 12px;
      margin: 10px 0;
      font-size: 14px;
    }
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .btns button {
      padding: 16px 8px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 16px;
      border: 2px solid var(--app-line);
      background: #fff;
      cursor: pointer;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
    }
    .btns button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(18, 28, 20, 0.08);
    }
    .btns button.agree {
      border-color: var(--ok);
      color: var(--ok);
    }
    .btns button.disagree {
      border-color: var(--warn);
      color: var(--warn);
    }

    #empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--app-muted);
    }
    #empty .icon {
      font-size: 40px;
    }
    .status {
      font-size: 13px;
      color: var(--app-muted);
      margin-top: 10px;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1d211d;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
  <body class="app-body">
    <div class="app-shell">
      <header class="app-topbar">
        <a href="menu.html" class="brand"
          ><span class="brand-mark">T</span
          ><span class="brand-copy"
            ><strong>TIUC</strong
            ><span data-i18n="common.back_curation"
              >← キュレーション</span
            ></span
          ></a
        >
        <div id="topbar-actions">
          <select id="lang-switcher" class="lang-switcher"></select>
          <div id="points-badge">0 pt</div>
        </div>
      </header>
      <h1 data-i18n="curate.h1">✏️ 修正・投票</h1>
      <p class="lead" data-i18n="curate.lead">
        バイリンガル向けサブモード。正しい訳を提案するか、他の人の提案に投票してください。
      </p>

      <div class="row-select" id="lang-select">
        <button
          type="button"
          data-lang="ja-en"
          class="active"
          data-i18n="common.arrow_lang_en"
        >
          英語
        </button>
        <button
          type="button"
          data-lang="ja-zh"
          data-i18n="common.arrow_lang_zh"
        >
          中国語
        </button>
        <button
          type="button"
          data-lang="ja-ko"
          data-i18n="common.arrow_lang_ko"
        >
          韓国語
        </button>
        <button type="button" data-lang="other" data-i18n="report.place_other">
          その他
        </button>
      </div>

      <div id="other-lang-wrap" hidden>
        <select id="other-lang">
          <option value="" data-i18n="common.unselected">未選択</option>
          <option value="ja-fr">Français</option>
          <option value="ja-es">Español</option>
          <option value="ja-hi">हिन्दी</option>
          <option value="ja-de">Deutsch</option>
          <option value="ja-it">Italiano</option>
          <option value="ja-pt">Português</option>
          <option value="ja-ru">Русский</option>
          <option value="ja-ar">العربية</option>
          <option value="ja-th">ไทย</option>
          <option value="ja-vi">Tiếng Việt</option>
          <option value="ja-id">Bahasa Indonesia</option>
          <option value="ja-tl">Filipino / Tagalog</option>
          <option value="ja-ne">नेपाली</option>
          <option value="ja-bn">বাংলা</option>
          <option value="ja-tr">Türkçe</option>
          <option value="ja-nl">Nederlands</option>
          <option value="ja-pl">Polski</option>
          <option value="ja-uk">Українська</option>
        </select>
      </div>

      <div id="tabs">
        <button
          type="button"
          id="tab-fix"
          class="active"
          data-i18n="curate.tab_fix"
        >
          修正する
        </button>
        <button type="button" id="tab-vote" data-i18n="curate.tab_vote">
          投票する
        </button>
      </div>

      <div class="panel" id="panel-fix">
        <div id="card" hidden>
          <div class="imgs" id="fix-imgs"></div>
          <p class="meta" id="fix-meta"></p>

          <!-- 既に他の人の提案がある場合はこちら(投票UI)を表示する -->
          <div id="fix-vote-view" hidden>
            <p class="fixed-box" id="fix-vote-fixed"></p>
            <div class="btns">
              <button
                type="button"
                class="disagree"
                id="fix-vote-disagree"
                data-i18n="curate.btn_disagree"
              >
                👎 賛成しない
              </button>
              <button
                type="button"
                class="agree"
                id="fix-vote-agree"
                data-i18n="curate.btn_agree"
              >
                👍 賛成
              </button>
            </div>
          </div>

          <!-- 提案がまだ無い場合はこちら(修正案の提出フォーム)を表示する -->
          <div id="fix-propose-view">
            <p class="fixed-box" id="fix-first-prompt" data-i18n="curate.be_first_prompt" hidden>
              修正案がまだありません。最初の投稿者になりましょう！
            </p>
            <div class="verdict-row">
              <label
                ><input type="radio" name="verdict" value="fix" checked /><span
                  data-i18n="curate.verdict_fix"
                  >修正が必要</span
                ></label
              >
              <label
                ><input type="radio" name="verdict" value="no_issue" /><span
                  data-i18n="curate.verdict_no_issue"
                  >実は問題なし</span
                ></label
              >
            </div>
            <div id="fix-fields">
              <label
                class="field"
                for="original-text"
                data-i18n="curate.label_original"
                >原文(読み取れた日本語)</label
              >
              <input type="text" id="original-text" maxlength="500" />
              <label
                class="field"
                for="translated-text"
                data-i18n="curate.label_translated"
                >現在の訳文</label
              >
              <input type="text" id="translated-text" maxlength="500" />
              <label class="field" for="fixed-text" data-i18n="curate.label_fixed"
                >修正後の訳文</label
              >
              <input type="text" id="fixed-text" maxlength="500" />
              <label
                class="field"
                for="explanation"
                data-i18n="curate.label_explanation"
                >なぜ変か(任意)</label
              >
              <textarea id="explanation" rows="2" maxlength="500"></textarea>
            </div>
            <button
              type="button"
              id="submit-fix"
              data-i18n="curate.submit_fix_btn"
            >
              この内容で提案する
            </button>
          </div>
          <button type="button" id="skip-fix" class="skip-btn" data-i18n="judge.skip_btn">
            ⏭ スキップして次へ
          </button>
        </div>
        <div id="empty-fix" class="panel" hidden>
          <div id="empty">
            <p class="icon">🎉</p>
            <p data-i18n="curate.empty_fix">
              今この言語ペアで修正待ちの投稿はありません。
            </p>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-vote" hidden>
        <div id="vote-card" hidden>
          <div class="imgs" id="vote-imgs"></div>
          <p class="meta" id="vote-meta"></p>
          <p class="fixed-box" id="vote-fixed"></p>
          <div class="btns">
            <button
              type="button"
              class="disagree"
              id="btn-disagree"
              data-i18n="curate.btn_disagree"
            >
              👎 賛成しない
            </button>
            <button
              type="button"
              class="agree"
              id="btn-agree"
              data-i18n="curate.btn_agree"
            >
              👍 賛成
            </button>
          </div>
          <button type="button" id="skip-vote" class="skip-btn" data-i18n="judge.skip_btn">
            ⏭ スキップして次へ
          </button>
        </div>
        <div id="empty-vote" hidden>
          <div id="empty">
            <p class="icon">🎉</p>
            <p data-i18n="curate.empty_vote">
              今この言語ペアで投票できる提案はありません。
            </p>
          </div>
        </div>
      </div>

      <p class="status" id="status"></p>
      <div class="toast" id="toast"></div>

      <script type="module">
        import { getUserId, bootstrapAuth } from "./auth.js";
        import { t, applyI18n, initLangSwitcher } from "./i18n.js";

        applyI18n();
        initLangSwitcher();

        let userId = getUserId();
        const authReady = bootstrapAuth().then((r) => {
          userId = r.userId;
        });
        const $ = (id) => document.getElementById(id);

        let langPair = "ja-en";
        let mode = "fix";
        let currentPost = null;
        let currentCorrection = null;
        let currentFixVote = null;
        let seenFix = [];
        let seenVote = [];

        // 地図などから lang_pair 指定で来た場合は、主要3言語か「その他」を自動選択する
        const urlLangPair = new URLSearchParams(location.search).get("lang_pair");
        if (urlLangPair) {
          const directBtn = document.querySelector(
            `#lang-select button[data-lang="${urlLangPair}"]`,
          );

          if (directBtn) {
            document
              .querySelectorAll("#lang-select button")
              .forEach((b) => b.classList.remove("active"));
            directBtn.classList.add("active");
            langPair = urlLangPair;
          } else {
            const otherBtn = document.querySelector(
              '#lang-select button[data-lang="other"]',
            );
            const otherOption = document.querySelector(
              `#other-lang option[value="${urlLangPair}"]`,
            );

            if (otherBtn && otherOption) {
              document
                .querySelectorAll("#lang-select button")
                .forEach((b) => b.classList.remove("active"));
              otherBtn.classList.add("active");
              $("other-lang-wrap").hidden = false;
              $("other-lang").value = urlLangPair;
              langPair = urlLangPair;
            }
          }
        }

        async function loadPointsBadge() {
          try {
            const res = await fetch(`/api/mypage?user_id=${userId}`);
            const j = await res.json();
            if (j.ok)
              $("points-badge").textContent =
                `${j.summary.points_total} pt / Lv.${j.summary.level}`;
          } catch {
            /* バッジのみ */
          }
        }
        function showToast(text) {
          const t = $("toast");
          t.textContent = text;
          t.classList.add("show");
          setTimeout(() => t.classList.remove("show"), 1400);
        }

        document.querySelectorAll("#lang-select button").forEach((btn) => {
          btn.addEventListener("click", () => {
            document
              .querySelectorAll("#lang-select button")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");

            if (btn.dataset.lang === "other") {
              $("other-lang-wrap").hidden = false;

              if (!$("other-lang").value) {
                currentPost = null;
                currentCorrection = null;
                currentFixVote = null;
                $("card").hidden = true;
                $("vote-card").hidden = true;
                $("empty-fix").hidden = true;
                $("empty-vote").hidden = true;
                $("status").textContent = "";
                return;
              }

              langPair = $("other-lang").value;
            } else {
              $("other-lang-wrap").hidden = true;
              langPair = btn.dataset.lang;
            }

            seenFix = [];
            seenVote = [];
            refreshCurrent();
          });
        });

        $("other-lang").addEventListener("change", () => {
          if (!$("other-lang").value) {
            currentPost = null;
            currentCorrection = null;
            currentFixVote = null;
            $("card").hidden = true;
            $("vote-card").hidden = true;
            $("empty-fix").hidden = true;
            $("empty-vote").hidden = true;
            $("status").textContent = "";
            return;
          }

          langPair = $("other-lang").value;
          seenFix = [];
          seenVote = [];
          refreshCurrent();
        });

        $("tab-fix").addEventListener("click", () => setMode("fix"));
        $("tab-vote").addEventListener("click", () => setMode("vote"));
        function setMode(m) {
          mode = m;
          $("tab-fix").classList.toggle("active", m === "fix");
          $("tab-vote").classList.toggle("active", m === "vote");
          $("panel-fix").hidden = m !== "fix";
          $("panel-vote").hidden = m !== "vote";
          refreshCurrent();
        }

        document.querySelectorAll("input[name=verdict]").forEach((r) => {
          r.addEventListener("change", () => {
            $("fix-fields").style.display =
              document.querySelector("input[name=verdict]:checked").value ===
              "fix"
                ? "block"
                : "none";
          });
        });

        async function refreshCurrent() {
          $("status").textContent = "";
          if (mode === "fix") await loadFixNext();
          else await loadVoteNext();
        }

        async function loadFixNext() {
          $("card").hidden = true;
          $("empty-fix").hidden = true;
          $("status").textContent = t("common.loading");
          await authReady;
          try {
            const res = await fetch(
              `/api/correct/next?${new URLSearchParams({ user_id: userId, lang_pair: langPair, exclude: seenFix.slice(-20).join(",") })}`,
            );
            const j = await res.json();
            if (!j.ok) throw new Error(j.error);
            $("status").textContent = "";
            if (!j.post) {
              $("empty-fix").hidden = false;
              currentPost = null;
              currentFixVote = null;
              return;
            }
            currentPost = j.post;
            $("fix-imgs").innerHTML =
              `<div><img src="${currentPost.src_image_url}" alt="${t("common.alt_translated")}"><p class="cap">${t("common.alt_translated")}</p></div>` +
              (currentPost.tgt_image_url
                ? `<div><img src="${currentPost.tgt_image_url}" alt="${t("common.alt_original")}"><p class="cap">${t("common.alt_original")}</p></div>`
                : "");
            $("fix-meta").textContent = currentPost.situation
              ? t("common.memo_prefix", { text: currentPost.situation })
              : "";

            if (j.existing_correction) {
              currentFixVote = j.existing_correction;
              $("fix-vote-fixed").textContent =
                currentFixVote.verdict === "no_issue"
                  ? t("curate.verdict_no_issue_result")
                  : t("curate.proposed_translation", {
                      fixed: currentFixVote.fixed_text,
                    }) +
                    (currentFixVote.explanation
                      ? ` (${currentFixVote.explanation})`
                      : "");
              $("fix-vote-view").hidden = false;
              $("fix-propose-view").hidden = true;
            } else {
              currentFixVote = null;
              $("fix-vote-view").hidden = true;
              $("fix-propose-view").hidden = false;
              $("fix-first-prompt").hidden = false;
              $("original-text").value = currentPost.original_text || "";
              $("translated-text").value = currentPost.translated_text || "";
              $("fixed-text").value = "";
              $("explanation").value = "";
              document.querySelector(
                "input[name=verdict][value=fix]",
              ).checked = true;
              $("fix-fields").style.display = "block";
            }
            $("card").hidden = false;
          } catch (e) {
            $("status").textContent = e.message;
          }
        }

        $("skip-fix").addEventListener("click", () => {
          if (currentPost) seenFix.push(currentPost.post_id);
          loadFixNext();
        });

        $("submit-fix").addEventListener("click", async () => {
          if (!currentPost) return;
          const verdict = document.querySelector(
            "input[name=verdict]:checked",
          ).value;
          if (verdict === "fix" && !$("fixed-text").value.trim()) {
            $("status").textContent = t("curate.fixed_text_required");
            return;
          }
          $("submit-fix").disabled = true;
          try {
            const res = await fetch("/api/correct/submit", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                user_id: userId,
                post_id: currentPost.post_id,
                verdict,
                fixed_text: $("fixed-text").value.trim() || null,
                explanation: $("explanation").value.trim() || null,
                original_text: $("original-text").value.trim() || null,
                translated_text: $("translated-text").value.trim() || null,
              }),
            });
            const j = await res.json();
            if (!j.ok) throw new Error(j.error);
            showToast(t("curate.toast_proposed", { points: j.points }));
            loadPointsBadge();
            loadFixNext();
          } catch (e) {
            $("status").textContent = e.message;
          } finally {
            $("submit-fix").disabled = false;
          }
        });

        async function voteOnFixCorrection(agree) {
          if (!currentFixVote) return;
          document
            .querySelectorAll("#fix-vote-view .btns button")
            .forEach((b) => (b.disabled = true));
          try {
            const res = await fetch("/api/correct/vote/submit", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                user_id: userId,
                correction_id: currentFixVote.correction_id,
                agree,
              }),
            });
            const j = await res.json();
            if (!j.ok) throw new Error(j.error);
            showToast(
              `+${j.points}pt` +
                (j.confirmed ? t("curate.toast_confirmed_suffix") : ""),
            );
            loadPointsBadge();
            loadFixNext();
          } catch (e) {
            $("status").textContent = e.message;
          } finally {
            document
              .querySelectorAll("#fix-vote-view .btns button")
              .forEach((b) => (b.disabled = false));
          }
        }
        $("fix-vote-agree").addEventListener("click", () =>
          voteOnFixCorrection(true),
        );
        $("fix-vote-disagree").addEventListener("click", () =>
          voteOnFixCorrection(false),
        );

        async function loadVoteNext() {
          $("vote-card").hidden = true;
          $("empty-vote").hidden = true;
          $("status").textContent = t("common.loading");
          await authReady;
          try {
            const res = await fetch(
              `/api/correct/vote/next?${new URLSearchParams({ user_id: userId, lang_pair: langPair, exclude: seenVote.slice(-20).join(",") })}`,
            );
            const j = await res.json();
            if (!j.ok) throw new Error(j.error);
            $("status").textContent = "";
            if (!j.correction) {
              $("empty-vote").hidden = false;
              currentCorrection = null;
              return;
            }
            currentCorrection = j.correction;
            $("vote-imgs").innerHTML =
              `<div><img src="${currentCorrection.src_image_url}" alt="${t("common.alt_translated")}"><p class="cap">${t("common.alt_translated")}</p></div>` +
              (currentCorrection.tgt_image_url
                ? `<div><img src="${currentCorrection.tgt_image_url}" alt="${t("common.alt_original")}"><p class="cap">${t("common.alt_original")}</p></div>`
                : "");
            $("vote-meta").textContent = t("curate.vote_meta", {
              original: currentCorrection.original_text || "—",
              translated: currentCorrection.translated_text || "—",
            });
            $("vote-fixed").textContent =
              currentCorrection.verdict === "no_issue"
                ? t("curate.verdict_no_issue_result")
                : t("curate.proposed_translation", {
                    fixed: currentCorrection.fixed_text,
                  }) +
                  (currentCorrection.explanation
                    ? ` (${currentCorrection.explanation})`
                    : "");
            $("vote-card").hidden = false;
          } catch (e) {
            $("status").textContent = e.message;
          }
        }

        async function vote(agree) {
          if (!currentCorrection) return;
          document
            .querySelectorAll("#vote-card .btns button")
            .forEach((b) => (b.disabled = true));
          try {
            const res = await fetch("/api/correct/vote/submit", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                user_id: userId,
                correction_id: currentCorrection.correction_id,
                agree,
              }),
            });
            const j = await res.json();
            if (!j.ok) throw new Error(j.error);
            showToast(
              `+${j.points}pt` +
                (j.confirmed ? t("curate.toast_confirmed_suffix") : ""),
            );
            loadPointsBadge();
            loadVoteNext();
          } catch (e) {
            $("status").textContent = e.message;
          } finally {
            document
              .querySelectorAll("#vote-card .btns button")
              .forEach((b) => (b.disabled = false));
          }
        }
        $("btn-agree").addEventListener("click", () => vote(true));
        $("btn-disagree").addEventListener("click", () => vote(false));

        $("skip-vote").addEventListener("click", () => {
          if (currentCorrection) seenVote.push(currentCorrection.correction_id);
          loadVoteNext();
        });

        authReady.then(() => {
          loadPointsBadge();
          refreshCurrent();
        });
      </script>
    </div>
  </body>
</html>
