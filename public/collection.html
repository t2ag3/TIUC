<!doctype html>
<html lang="ja" class="app-html">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <title data-i18n="collection.page_title">街ことばコレクション - TIUC</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --app-line: #e3e6df;
      --app-muted: #6b7068;
      --app-text: #1d211d;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
      color: var(--app-text);
    }
    h1 {
      font-size: 21px;
      margin: 0 0 5px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .lead {
      color: var(--app-muted);
      font-size: 13px;
      margin: 0 0 18px;
      line-height: 1.7;
    }
    .empty {
      color: var(--app-muted);
      font-size: 13px;
      padding: 12px 0;
    }

    /* ---- タイル一覧（5x20＝最大100体を想定した密なグリッド） ---- */
    .dex-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .dex-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--app-line);
      background: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    .dex-card:hover {
      transform: translateY(-2px);
    }
    .art {
      position: relative;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .mon {
      width: 38px;
      height: 38px;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.18));
    }
    .r1 .art,
    .detail-art.r1 {
      background: #e7ece9;
    }
    .r2 .art,
    .detail-art.r2 {
      background: radial-gradient(circle at 50% 42%, #bfe3d3, #7fc4aa);
    }
    .r3 .art,
    .detail-art.r3 {
      background: radial-gradient(
        circle at 50% 40%,
        #a9e8ff,
        #4f9bd6 70%,
        #2f6ea8
      );
    }
    .r4 .art,
    .detail-art.r4 {
      background: linear-gradient(
        135deg,
        #fff27a,
        #ffb347 26%,
        #ff6fd8 52%,
        #8f7bff 76%,
        #5ec6ff
      );
      background-size: 240% 240%;
      animation: dex-shine 3.2s ease infinite;
    }
    @keyframes dex-shine {
      0%,
      100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }
    .badge {
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 3;
      background: #fff;
      color: #b02a8a;
      font-size: 7px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 8px;
      letter-spacing: 0.04em;
    }
    .meta {
      padding: 5px 4px 7px;
      text-align: center;
    }
    .cn {
      font-weight: 700;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 未取得はシルエット＋グレー背景のみ。名前・★・レア度は取得するまで伏せる */
    .dex-card.locked .art {
      background: #dfe3de !important;
      animation: none !important;
    }
    .dex-card.locked .mon {
      filter: brightness(0) opacity(0.45);
    }
    .dex-card.locked .cn {
      color: var(--app-muted);
    }
    .detail-art.locked {
      background: #dfe3de;
    }
    .detail-art.locked .mon {
      filter: brightness(0) opacity(0.45);
    }

    /* ---- 詳細モーダル ---- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 28, 20, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }
    .modal-backdrop[hidden] {
      display: none;
    }
    .modal-card {
      background: #fff;
      border-radius: 20px;
      max-width: 380px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 20px;
      text-align: center;
      box-shadow: 0 16px 50px rgba(18, 28, 20, 0.16);
    }
    .modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      border: none;
      background: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--app-muted);
      line-height: 1;
      padding: 4px;
    }
    .detail-art {
      width: 110px;
      height: 110px;
      margin: 0 auto 14px;
      border-radius: 20px;
      display: grid;
      place-items: center;
    }
    .detail-art .mon {
      width: 68px;
      height: 68px;
    }
    .detail-name {
      font-size: 18px;
      font-weight: 800;
    }
    .detail-stars {
      font-size: 15px;
      letter-spacing: 2px;
      margin-top: 4px;
    }
    .detail-desc {
      font-size: 13px;
      color: var(--app-muted);
      margin: 12px 0;
      line-height: 1.7;
      text-align: left;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 8px 0;
      border-top: 1px solid var(--app-line);
      text-align: left;
    }
    .detail-row span:first-child {
      color: var(--app-muted);
    }
    .select-btn {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--color-accent, #1a5c3a);
      border-radius: 999px;
      background: #fff;
      color: var(--color-accent, #1a5c3a);
      cursor: pointer;
    }
    .select-btn.selected {
      background: var(--color-accent, #1a5c3a);
      color: #fff;
    }
    .select-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .tier-breakdown {
      margin-top: 4px;
    }
    .tier-heading {
      margin: 10px 0 0;
      font-size: 11px;
      color: var(--app-muted);
      text-align: left;
    }
    .synth-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    .synth-btn {
      width: 100%;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--brand, #09804f);
      border-radius: 999px;
      background: var(--brand, #09804f);
      color: #fff;
      cursor: pointer;
    }
    .synth-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
  <body class="app-body">
    <div class="app-shell">
      <header class="app-topbar">
        <a
          href="mypage.html"
          class="brand"
          data-i18n-aria-label="index.brand_aria"
          ><span class="brand-mark">T</span
          ><span class="brand-copy"
            ><strong>TIUC</strong
            ><span data-i18n="collection.back_mypage"
              >← マイページ</span
            ></span
          ></a
        >
        <select id="lang-switcher" class="lang-switcher"></select>
      </header>
      <h1 data-i18n="game.collect_title">街ことばコレクション</h1>
      <p class="lead" data-i18n="game.collect_sub">
        投稿・判定・修正のたびにキャラがドロップ。レベルアップや修正確定ではレアが確定で手に入ります。
      </p>

      <div id="collection">
        <div class="empty" data-i18n="common.loading">読み込み中…</div>
      </div>
    </div>

    <div id="detail-modal" class="modal-backdrop" hidden>
      <div class="modal-card">
        <button
          type="button"
          id="detail-close"
          class="modal-close"
          data-i18n-aria-label="common.close"
          aria-label="閉じる"
        >
          ×
        </button>
        <div id="detail-body"></div>
      </div>
    </div>

    <script type="module">
      import { getUserId, bootstrapAuth } from "./auth.js";
      import { t, applyI18n, initLangSwitcher } from "./i18n.js";
      import "./track.js";

      applyI18n();
      initLangSwitcher();

      const $ = (id) => document.getElementById(id);
      let userId = getUserId();
      await bootstrapAuth().then((r) => {
        userId = r.userId;
      });

      let species = [];
      let currentDisplaySpeciesId = null;
      // 合成に必要な同ティア枚数(from_rarity -> 必要数)。サーバ側(SYNTHESIS_REQUIREMENTS)と対応。
      const SYNTH_REQ = { 1: 2, 2: 3 };

      const jst = (ts) =>
        ts
          ? new Date(ts * 1000).toLocaleDateString("ja-JP", {
              timeZone: "Asia/Tokyo",
              year: "numeric",
              month: "long",
              day: "numeric",
            })
          : "—";

      async function load() {
        const [collectionRes, charRes] = await Promise.all([
          fetch(`/api/game/collection?user_id=${userId}`).then((r) =>
            r.json(),
          ),
          fetch(`/api/game/character?user_id=${userId}`).then((r) =>
            r.json(),
          ),
        ]);
        if (!collectionRes.ok) return;
        species = collectionRes.species;
        if (charRes.ok) currentDisplaySpeciesId = charRes.display_species_id;
        render();
      }

      function render() {
        $("collection").innerHTML = `<div class="dex-grid">${species
          .map((s) => {
            const locked = s.count <= 0;
            // 未取得はレア度も名前も伏せる（背景色でレアが分かってしまうのを防ぐ）
            const name = locked ? "???" : t(`game.species.${s.name_key}.name`);
            const badge =
              !locked && s.rarity >= 4
                ? `<div class="badge">SPECIAL</div>`
                : "";
            const rarityClass = locked ? "" : `r${s.rarity}`;
            return `
              <div class="dex-card ${rarityClass} ${locked ? "locked" : ""}" data-id="${s.id}">
                ${badge}
                <div class="art"><img class="mon" src="images/species/${s.id}.png" onerror="this.onerror=null;this.src='images/mon-placeholder.svg'" alt=""></div>
                <div class="meta">
                  <div class="cn">${name}</div>
                </div>
              </div>
            `;
          })
          .join("")}</div>`;

        $("collection")
          .querySelectorAll(".dex-card")
          .forEach((card) => {
            card.addEventListener("click", () => openDetail(card.dataset.id));
          });
      }

      function openDetail(id) {
        const s = species.find((x) => x.id === id);
        if (!s) return;
        const locked = s.count <= 0;
        const name = locked ? "???" : t(`game.species.${s.name_key}.name`);
        const desc = locked
          ? t("collection.locked_desc")
          : t(`game.species.${s.name_key}.desc`);
        const selected = s.id === currentDisplaySpeciesId;
        const artClass = locked ? "locked" : `r${s.rarity}`;

        const tierRows = !locked
          ? [1, 2, 3, 4]
              .filter((tier) => (s.tiers[tier] || 0) > 0)
              .map(
                (tier) => `
                  <div class="detail-row">
                    <span>${"★".repeat(tier)}</span>
                    <span>${t("game.dex_owned", { n: s.tiers[tier] })}</span>
                  </div>
                `,
              )
              .join("")
          : "";

        const synthButtons = !locked
          ? [1, 2]
              .filter((tier) => (s.tiers[tier] || 0) >= SYNTH_REQ[tier])
              .map(
                (tier) => `
                  <button type="button" class="synth-btn" data-from="${tier}">
                    ${t("collection.synthesize_btn", { n: SYNTH_REQ[tier], from: "★".repeat(tier), to: "★".repeat(tier + 1) })}
                  </button>
                `,
              )
              .join("")
          : "";

        $("detail-body").innerHTML = `
          <div class="detail-art ${artClass}"><img class="mon" src="images/species/${s.id}.png" onerror="this.onerror=null;this.src='images/mon-placeholder.svg'" alt=""></div>
          <div class="detail-name">${name}</div>
          ${locked ? "" : `<div class="detail-stars r${s.rarity}">${"★".repeat(s.rarity)}</div>`}
          <p class="detail-desc">${desc}</p>
          ${
            !locked
              ? `<div class="detail-row"><span>${t("collection.owned_count_label")}</span><span>${t("game.dex_owned", { n: s.count })}</span></div>
                 <div class="detail-row"><span>${t("collection.first_at_label")}</span><span>${jst(s.first_at)}</span></div>`
              : ""
          }
          ${
            tierRows
              ? `<div class="tier-breakdown"><p class="tier-heading">${t("collection.tiers_label")}</p>${tierRows}</div>`
              : ""
          }
          ${synthButtons ? `<div class="synth-list">${synthButtons}</div>` : ""}
          ${
            !locked
              ? `<button type="button" id="select-btn" class="select-btn ${selected ? "selected" : ""}">${selected ? t("mypage.collection_selected") : t("mypage.collection_select")}</button>`
              : ""
          }
        `;
        $("detail-modal").hidden = false;

        $("detail-body")
          .querySelectorAll(".synth-btn")
          .forEach((sbtn) => {
            sbtn.addEventListener("click", async () => {
              sbtn.disabled = true;
              const fromRarity = Number(sbtn.dataset.from);
              const r = await fetch("/api/game/synthesize", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({
                  user_id: userId,
                  species_id: s.id,
                  from_rarity: fromRarity,
                }),
              }).then((x) => x.json());
              if (r.ok) {
                await load();
                openDetail(id);
              } else {
                sbtn.disabled = false;
              }
            });
          });

        const btn = $("select-btn");
        if (btn) {
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            const r = await fetch("/api/game/collection/select", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ user_id: userId, species_id: s.id }),
            }).then((x) => x.json());
            if (r.ok) {
              currentDisplaySpeciesId = s.id;
              openDetail(id);
            } else {
              btn.disabled = false;
            }
          });
        }
      }

      $("detail-close").addEventListener("click", () => {
        $("detail-modal").hidden = true;
      });
      $("detail-modal").addEventListener("click", (e) => {
        if (e.target === $("detail-modal")) $("detail-modal").hidden = true;
      });

      load();
    </script>
  </body>
</html>
