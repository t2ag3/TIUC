<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>相棒とクエスト - TIUC</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --line: #e3e6df;
      --muted: #6b7068;
      --bg: #f5f7f3;
      --card: #fff;
      --accent: var(--color-accent, #1a5c3a);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #eef5f0, #f7f8f5 34%);
      font-family:
        system-ui,
        -apple-system,
        sans-serif;
      color: #1e231f;
    }

    .wrap {
      width: min(100%, 760px);
      margin: auto;
      padding: 16px 16px 50px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .top a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }

    .hero {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(20, 40, 25, 0.07);
    }

    #sprite-link {
      display: inline-block;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    #sprite-link:hover #sprite {
      transform: scale(1.06);
    }

    #sprite {
      font-size: 88px;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    .lv {
      font-size: 22px;
      font-weight: 800;
      margin-top: 8px;
    }

    .stage {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .bar {
      width: min(100%, 340px);
      height: 11px;
      background: #e5e8e2;
      border-radius: 999px;
      margin: 18px auto 6px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      transition: width 0.35s;
    }

    .xp {
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .action {
      padding: 14px 8px;
      border-radius: 16px;
      text-decoration: none;
      text-align: center;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      min-width: 0;
    }

    .action > span:first-child {
      display: block;
      font-size: 24px;
      margin-bottom: 4px;
    }

    @media (max-width: 560px) {
      .action {
        padding: 12px 4px;
        font-size: 10px;
      }

      .action > span:first-child {
        font-size: 22px;
      }
    }

    .action.primary {
      background: #1d603e;
      color: #fff;
      border-color: #1d603e;
    }

    .action.secondary {
      background: #214f69;
      color: #fff;
      border-color: #214f69;
    }

    h2 {
      font-size: 17px;
      margin: 28px 2px 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 9px;
    }

    .quest {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .quest.claimed {
      background: #e1e5e0;
      border-color: #c6ccc5;
    }

    .quest.claimed .qt,
    .quest.claimed .qd,
    .quest.claimed .qr {
      opacity: 0.72;
    }

    .quest-body {
      flex: 1;
    }

    .qt {
      font-size: 14px;
      font-weight: 750;
    }

    .qd {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .qr {
      font-size: 11px;
      color: var(--accent);
      margin-top: 4px;
    }

    .claim {
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fff;
      color: var(--accent);
      font-weight: 700;
      font-size: 11px;
    }

    .claim.ready {
      background: var(--accent);
      color: #fff;
    }

    .claim:disabled {
      border-color: #ddd;
      color: #aaa;
      background: #f7f7f5;
    }

    .celebrate {
      animation: claim-celebrate 550ms ease-out;
    }

    @keyframes claim-celebrate {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 rgba(26, 92, 58, 0);
      }

      35% {
        transform: scale(1.12);
        box-shadow: 0 0 18px rgba(26, 92, 58, 0.45);
      }

      65% {
        transform: scale(0.96);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 0 rgba(26, 92, 58, 0);
      }
    }
    .zukan {
      display: grid;
      grid-template-columns: 80px repeat(4, 1fr);
      gap: 6px;
      align-items: center;
    }

    .zh {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }

    .zl {
      font-size: 11px;
      font-weight: 700;
    }

    .slot {
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #f7f7f5;
      color: #bbb;
      font-size: 15px;
    }

    .slot.on {
      background: #edf5ef;
      border-color: #75a987;
      color: #1d603e;
      font-size: clamp(20px, 6vw, 72px);
    }

    .impact {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tile {
      text-align: center;
      padding: 12px 4px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .tile .n {
      font-size: 18px;
      font-weight: 800;
    }

    .tile .l {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .empty {
      font-size: 12px;
      color: var(--muted);
      padding: 10px 2px;
    }


    .quest-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 28px;
      margin-bottom: 10px;
    }

    .quest-heading-row h2 {
      margin: 0;
    }

    .test-buttons {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }

    .test-button {
      width: 120px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      cursor: pointer;
    }

    .test-button:hover {
      border-color: #b9c3ba;
      color: #1e231f;
    }

    .claim-confetti {
      position: fixed;
      z-index: 119;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      pointer-events: none;
      background: currentColor;
      animation: claim-confetti-fire 700ms ease-out forwards;
    }

    @keyframes claim-confetti-fire {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
          scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle))
          translateX(var(--distance)) scale(0.3);
      }
    }

    .levelup-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 22, 17, 0.64);
      backdrop-filter: blur(4px);
    }

    .levelup-backdrop[hidden] {
      display: none;
    }

    .levelup-modal {
      position: relative;
      width: min(100%, 430px);
      overflow: visible;
      padding: 28px 24px 26px;
      border-radius: 28px;
      background: #fff;
      text-align: center;
      box-shadow: 0 24px 70px rgba(10, 25, 15, 0.3);
      animation: levelup-pop 420ms cubic-bezier(0.2, 1.35, 0.4, 1);
    }

    .levelup-poppers {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: -2px 8px 6px;
      font-size: clamp(44px, 12vw, 64px);
      line-height: 1;
    }

    .levelup-poppers .left {
      transform: rotate(-12deg);
    }

    .levelup-poppers .right {
      transform: scaleX(-1) rotate(-12deg);
    }

    .levelup-title {
      margin: 0;
      font-size: clamp(23px, 6vw, 31px);
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .levelup-levels {
      margin-top: 12px;
      color: var(--accent);
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 850;
    }

    .levelup-close {
      margin-top: 22px;
      min-width: 150px;
      padding: 11px 22px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .levelup-firework {
      position: fixed;
      z-index: 210;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      pointer-events: none;
      opacity: 0;
      animation: levelup-firework 900ms ease-out forwards;
      animation-fill-mode: backwards;
    }

    @keyframes levelup-pop {
      from {
        opacity: 0;
        transform: scale(0.72);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes levelup-firework {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
          scale(0);
      }

      5% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
          scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle))
          translateX(var(--distance)) scale(0.25);
      }
    }

    @media (max-width: 560px) {
      .actions {
        grid-template-columns: repeat(3, 1fr);
      }
      .zukan {
        grid-template-columns: 64px repeat(4, 1fr);
      }
      .impact {
        grid-template-columns: repeat(2, 1fr);
      }
      .hero {
        padding-top: 24px;
      }
    }
  </style>
  <body>
    <div class="wrap">
      <div class="top">
        <a href="/?home=1" data-i18n="game.back_top">← TIUCについて</a>
        <div style="display: flex; align-items: center; gap: 10px">
          <select id="lang-switcher" class="lang-switcher"></select>
          <a href="mypage.html" data-i18n="common.mypage_link">マイページ</a>
        </div>
      </div>

      <section class="hero">
        <a id="sprite-link" href="mypage.html" aria-label="My Page">
          <div id="sprite">🥚</div>
          <div class="lv" id="level">Lv.1</div>
          <div class="stage" id="stage" data-i18n="game.mypage_hint">
            クリックしてマイページへ
          </div>
        </a>
        

        <div class="bar">
          <div class="fill" id="fill" style="width: 0%"></div>
        </div>
        <div class="xp" id="xp">0 / 2 XP</div>
      </section>

      <div class="actions">
        <a class="action primary" href="report.html">
          <span>📷</span>
          <span data-i18n="game.action_find">画像を投稿</span>
        </a>

        <a class="action secondary" href="menu.html">
          <span>🔍</span>
          <span data-i18n="game.action_review">確認・修正</span>
        </a>

        <a class="action" href="map.html">
          <span>🗺️</span>
          <span data-i18n="game.action_map">街を見る</span>
        </a>
      </div>

      <div class="quest-heading-row">
        <h2 data-i18n="game.quests">クエスト</h2>
        <div class="test-buttons">
          <button class="test-button" id="popper-test" type="button">
            🎉 Test popper
          </button>
          <button class="test-button" id="levelup-test" type="button">
            🎆 Test level up
          </button>
        </div>
      </div>
      <div id="quests">
        <div class="empty" data-i18n="common.loading">読み込み中…</div>
      </div>

      <h2>
        <span data-i18n="game.encyclopedia">街ことば図鑑</span>
        <span
          id="zukan-count"
          style="font-size: 12px; color: var(--muted); font-weight: 400"
        ></span>
      </h2>

      <div class="card">
        <div id="zukan"></div>
      </div>

      <h2 data-i18n="game.impact">地域インパクト</h2>
      <div id="impact">
        <div class="empty" data-i18n="game.impact_empty">
          まだ地域データがありません。
        </div>
      </div>
    </div>

    <div id="levelup-backdrop" class="levelup-backdrop" hidden>
      <div
        class="levelup-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="levelup-title"
      >
        <div class="levelup-poppers" aria-hidden="true">
          <span class="left">🎉</span>
          <span class="right">🎉</span>
        </div>

        <h2
          id="levelup-title"
          class="levelup-title"
          data-i18n="game.levelup_title"
        >
          レベルアップおめでとう！
        </h2>

        <div id="levelup-levels" class="levelup-levels">Lv.5 → Lv.6</div>

        <button
          id="levelup-close"
          class="levelup-close"
          type="button"
          data-i18n="game.levelup_close"
        >
          やった！
        </button>
      </div>
    </div>

    <script type="module">
      import { getUserId, bootstrapAuth } from "./auth.js";
      import { t, applyI18n, initLangSwitcher } from "./i18n.js";

      applyI18n();
      initLangSwitcher();
      document.title = t("game.title");

      let userId = getUserId();
      await bootstrapAuth().then((r) => {
        userId = r.userId;
      });

      const $ = (id) => document.getElementById(id);

      const sprites = {
        egg: "🥚",
        chick: "🐣",
        bird: "🐦",
        guide: "🦉",
      };

      function celebrateButton(button) {
        if (!button) return;

        button.classList.remove("celebrate");

        // Force the animation to restart when repeatedly testing.
        void button.offsetWidth;

        button.classList.add("celebrate");
        button.addEventListener(
          "animationend",
          () => button.classList.remove("celebrate"),
          { once: true },
        );
      }

      function launchClaimPopper(sourceEl) {
        if (!sourceEl) return;

        const rect = sourceEl.getBoundingClientRect();
        const centerY = rect.top + rect.height / 2;

        launchButtonFirework(rect.left - 18, centerY);
        launchButtonFirework(rect.right + 18, centerY);
      }

      function launchButtonFirework(x, y) {
        const colors = [
          "#1a5c3a",
          "#214f69",
          "#d39426",
          "#a23a57",
          "#6d4aa8",
          "#e56d35",
        ];

        for (let i = 0; i < 16; i++) {
          const particle = document.createElement("span");
          particle.className = "claim-confetti";
          particle.style.left = `${x}px`;
          particle.style.top = `${y}px`;
          particle.style.color = colors[i % colors.length];
          particle.style.setProperty("--angle", `${i * (360 / 16)}deg`);
          particle.style.setProperty(
            "--distance",
            `${32 + Math.random() * 34}px`,
          );

          document.body.appendChild(particle);

          particle.addEventListener("animationend", () => {
            particle.remove();
          });
        }
      }

      function launchLevelupFireworks() {
        const backdrop = $("levelup-backdrop");
        if (!backdrop) return;

        const colors = [
          "#1a5c3a",
          "#214f69",
          "#d39426",
          "#a23a57",
          "#6d4aa8",
          "#e56d35",
          "#d94f70",
          "#3a8f80",
        ];

        const FIREWORK_COUNT = 12;

        for (let burstIndex = 0; burstIndex < FIREWORK_COUNT; burstIndex++) {
          // Keep the center of each explosion away from the very edge.
          const x = 10 + Math.random() * 80; // 10–90vw
          const y = 10 + Math.random() * 80; // 10–90vh

          // Randomly explode at any point during the next 1.5 seconds.
          const delay = Math.random() * 1500;

          const particleCount = 14 + Math.floor(Math.random() * 7); // 14–20

          for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement("span");

            particle.className = "levelup-firework";
            particle.style.left = `${x}vw`;
            particle.style.top = `${y}vh`;
            particle.style.color =
              colors[Math.floor(Math.random() * colors.length)];

            particle.style.animationDelay = `${delay}ms`;

            particle.style.setProperty(
              "--angle",
              `${i * (360 / particleCount) + Math.random() * 8}deg`,
            );

            particle.style.setProperty(
              "--distance",
              `${45 + Math.random() * 70}px`,
            );

            backdrop.appendChild(particle);

            particle.addEventListener("animationend", () => {
              particle.remove();
            });
          }
        }
      }

      function showLevelup(oldLevel, newLevel) {
        $("levelup-levels").textContent = `Lv.${oldLevel} → Lv.${newLevel}`;
        $("levelup-backdrop").hidden = false;
        requestAnimationFrame(launchLevelupFireworks);
      }

      function checkLevelup(currentLevel) {
        try {
          const key = `tiuc_game_level_${userId}`;
          const previousRaw = localStorage.getItem(key);

          if (previousRaw === null) {
            localStorage.setItem(key, String(currentLevel));
            return;
          }

          const previousLevel = Number(previousRaw);
          localStorage.setItem(key, String(currentLevel));

          if (
            Number.isFinite(previousLevel) &&
            currentLevel > previousLevel
          ) {
            showLevelup(previousLevel, currentLevel);
          }
        } catch {
          // localStorage が使えなくても通常表示を続ける
        }
      }

      $("levelup-close").addEventListener("click", () => {
        $("levelup-backdrop").hidden = true;
      });

      $("levelup-backdrop").addEventListener("click", (event) => {
        if (event.target === $("levelup-backdrop")) {
          $("levelup-backdrop").hidden = true;
        }
      });

      $("popper-test").addEventListener("click", (event) => {
        celebrateButton(event.currentTarget);
        launchClaimPopper(event.currentTarget);
      });

      $("levelup-test").addEventListener("click", () => {
        showLevelup(8, 9);
      });

      async function loadCharacter() {
        const j = await fetch(`/api/game/character?user_id=${userId}`).then(
          (r) => r.json(),
        );
        if (!j.ok) return;

        $("sprite").textContent = sprites[j.stage] || "🥚";
        $("level").textContent = `Lv.${j.level}`;
        $("xp").textContent = `${j.xp_into_level} / ${j.xp_for_next_level} XP`;

        checkLevelup(j.level);

        const p = j.xp_for_next_level
          ? Math.min(
              100,
              Math.round((j.xp_into_level / j.xp_for_next_level) * 100),
            )
          : 0;

        $("fill").style.width = `${p}%`;
      }

      async function loadQuests() {
        const j = await fetch(`/api/game/quests?user_id=${userId}`).then((r) =>
          r.json(),
        );
        if (!j.ok) return;

        $("quests").innerHTML = j.quests
          .map((q) => {
            const title = t(`game.quest.${q.id}.title`);
            const desc = t(`game.quest.${q.id}.desc`);

            const buttonText = q.claimed
              ? t("game.quest_claimed")
              : q.done
                ? t("game.quest_claim")
                : t("game.quest_incomplete");

            return `
              <div class="card quest ${q.claimed ? "claimed" : ""}">
                <div class="quest-body">
                  <div class="qt">${q.claimed ? "🏆 " : ""}${title}</div>
                  <div class="qd">${desc}</div>
                  <div class="qr">+${q.reward} XP</div>
                </div>
                <button
                  class="claim ${q.done && !q.claimed ? "ready" : ""}"
                  data-id="${q.id}"
                  ${!q.done || q.claimed ? "disabled" : ""}
                >${buttonText}</button>
              </div>
            `;
          })
          .join("");

        document.querySelectorAll(".claim.ready").forEach((b) =>
          b.addEventListener("click", async () => {
            celebrateButton(b);
            launchClaimPopper(b);
            b.disabled = true;

            const r = await fetch("/api/game/quests/claim", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                user_id: userId,
                quest_id: b.dataset.id,
              }),
            }).then((x) => x.json());

            if (r.ok) {
              await Promise.all([loadCharacter(), loadQuests()]);
            }
          }),
        );
      }

      async function loadZukan() {
        const j = await fetch(`/api/game/encyclopedia?user_id=${userId}`).then(
          (r) => r.json(),
        );
        if (!j.ok) return;

        const have = new Set(
          j.slots.map((x) => `${x.lang_pair}:${x.place_kind}`),
        );

        const langs = [
          ["ja-en", t("game.lang_en")],
          ["ja-zh", t("game.lang_zh")],
          ["ja-ko", t("game.lang_ko")],
        ];

        const kinds = [
          ["menu", t("game.kind_menu")],
          ["sign", t("game.kind_sign")],
          ["notice", t("game.kind_notice")],
          ["other", t("game.kind_other")],
        ];

        let h =
          '<div class="zukan"><div></div>' +
          kinds.map((k) => `<div class="zh">${k[1]}</div>`).join("");

        for (const l of langs) {
          h +=
            `<div class="zl">${l[1]}</div>` +
            kinds
              .map((k) => {
                const unlocked = have.has(`${l[0]}:${k[0]}`);
                return `<div class="slot ${unlocked ? "on" : ""}">${unlocked ? "🏆" : "?"}</div>`;
              })
              .join("");
        }

        h += "</div>";

        $("zukan").innerHTML = h;
        $("zukan-count").textContent = `${j.total} / 12`;
      }

      async function loadImpact() {
        const j = await fetch(`/api/game/impact?user_id=${userId}`).then((r) =>
          r.json(),
        );

        if (!j.ok || !j.region) {
          $("impact").innerHTML =
            `<div class="empty">${t("game.impact_empty")}</div>`;
          return;
        }

        const x = j.region;

        $("impact").innerHTML = `
    <div class="impact">
      <div class="tile">
        <div class="n">${x.posts || 0}</div>
        <div class="l">${t("game.impact_posts")}</div>
      </div>
      <div class="tile">
        <div class="n">${x.confirmed || 0}</div>
        <div class="l">${t("game.impact_confirmed")}</div>
      </div>
      <div class="tile">
        <div class="n">${x.adopted || 0}</div>
        <div class="l">${t("game.impact_adopted")}</div>
      </div>
      <div class="tile">
        <div class="n">${t("game.rank_value", { rank: x.rank })}</div>
        <div class="l">${t("game.impact_rank")}</div>
      </div>
    </div>
  `;
      }

      Promise.all([
        loadCharacter(),
        loadQuests(),
        loadZukan(),
        loadImpact(),
      ]).catch(console.error);
    </script>
  </body>
</html>
