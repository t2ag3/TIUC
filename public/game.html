<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>レベルとステータス - TIUC</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --line: #e3e6df;
      --muted: #6b7068;
      --bg: #f5f7f3;
      --card: #fff;
      --accent: var(--color-accent, #1a5c3a);
      --hair: var(--line);
      --grey: var(--muted);
      --brand: var(--accent);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #eef5f0, #f7f8f5 34%);
      font-family:
        system-ui,
        -apple-system,
        sans-serif;
      color: #1e231f;
    }

    .wrap {
      width: min(100%, 760px);
      margin: auto;
      padding: 16px 16px 50px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .top a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }

    .hero {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(20, 40, 25, 0.07);
    }

    #hero-link {
      display: block;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .char-lv {
      font-size: 22px;
      font-weight: 800;
    }

    .char-title {
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
      margin-top: 2px;
    }

    .bar {
      width: min(100%, 340px);
      height: 11px;
      background: #e5e8e2;
      border-radius: 999px;
      margin: 18px auto 6px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      transition: width 0.35s;
    }

    .xp {
      font-size: 12px;
      color: var(--muted);
    }

    .streak {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .streak b {
      color: #c9601f;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .action {
      padding: 14px 8px;
      border-radius: 16px;
      text-decoration: none;
      text-align: center;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      min-width: 0;
    }

    .action > span:first-child {
      display: block;
      font-size: 24px;
      margin-bottom: 4px;
    }

    @media (max-width: 560px) {
      .action {
        padding: 12px 4px;
        font-size: 10px;
      }

      .action > span:first-child {
        font-size: 22px;
      }
    }

    .action.primary {
      background: #1d603e;
      color: #fff;
      border-color: #1d603e;
    }

    .action.secondary {
      background: #214f69;
      color: #fff;
      border-color: #214f69;
    }

    .mypage-link {
      display: block;
      margin-top: 10px;
      padding: 13px 8px;
      border-radius: 16px;
      text-decoration: none;
      text-align: center;
      border: 1px dashed var(--line);
      background: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    /* ---- ヒーロー: 表示設定したキャラの見た目(選んでいなければ卵のプレースホルダー) ---- */
    .hero-mon-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e7ece9;
      box-shadow: 0 6px 16px rgba(9, 128, 79, 0.16);
    }
    .hero-mon-wrap.r2 { background: radial-gradient(circle at 50% 42%, #bfe3d3, #7fc4aa); }
    .hero-mon-wrap.r3 { background: radial-gradient(circle at 50% 40%, #a9e8ff, #4f9bd6 70%, #2f6ea8); }
    .hero-mon-wrap.r4 {
      background: linear-gradient(135deg, #fff27a, #ffb347 26%, #ff6fd8 52%, #8f7bff 76%, #5ec6ff);
      background-size: 240% 240%;
      animation: dex-shine 3.2s ease infinite;
    }
    @keyframes dex-shine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .hero-mon {
      width: 48px;
      height: 48px;
      image-rendering: pixelated;
      filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.18));
    }
    .hero-mon-empty {
      font-size: 34px;
      line-height: 1;
    }

    .levelup-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 22, 17, 0.64);
      backdrop-filter: blur(4px);
    }

    .levelup-backdrop[hidden] {
      display: none;
    }

    .levelup-modal {
      position: relative;
      width: min(100%, 430px);
      overflow: visible;
      padding: 28px 24px 26px;
      border-radius: 28px;
      background: #fff;
      text-align: center;
      box-shadow: 0 24px 70px rgba(10, 25, 15, 0.3);
      animation: levelup-pop 420ms cubic-bezier(0.2, 1.35, 0.4, 1);
    }

    .levelup-poppers {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: -2px 8px 6px;
      font-size: clamp(44px, 12vw, 64px);
      line-height: 1;
    }

    .levelup-poppers .left {
      transform: rotate(-12deg);
    }

    .levelup-poppers .right {
      transform: scaleX(-1) rotate(-12deg);
    }

    .levelup-title {
      margin: 0;
      font-size: clamp(23px, 6vw, 31px);
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .levelup-levels {
      margin-top: 12px;
      color: var(--accent);
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 850;
    }

    .levelup-close {
      margin-top: 22px;
      min-width: 150px;
      padding: 11px 22px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .levelup-firework {
      position: fixed;
      z-index: 210;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      pointer-events: none;
      opacity: 0;
      animation: levelup-firework 900ms ease-out forwards;
      animation-fill-mode: backwards;
    }

    @keyframes levelup-pop {
      from {
        opacity: 0;
        transform: scale(0.72);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes levelup-firework {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
          scale(0);
      }

      5% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
          scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle))
          translateX(var(--distance)) scale(0.25);
      }
    }

    @media (max-width: 560px) {
      .hero {
        padding-top: 24px;
      }
    }
  </style>
  <body>
    <div class="wrap">
      <div class="top">
        <a href="/?home=1" data-i18n="game.back_top">← TIUCについて</a>
        <div style="display: flex; align-items: center; gap: 10px">
          <select id="lang-switcher" class="lang-switcher"></select>
          <a href="mypage.html" data-i18n="common.mypage_link">マイページ</a>
        </div>
      </div>

      <section class="hero">
        <a id="hero-link" href="mypage.html" aria-label="My Page">
          <div class="hero-mon-wrap" id="hero-mon-wrap">
            <img class="hero-mon" id="hero-mon" src="images/mon-placeholder.svg" alt="" hidden />
            <span class="hero-mon-empty" id="hero-mon-empty">🥚</span>
          </div>
          <div class="char-lv" id="level">Lv.1</div>
          <div class="char-title" id="title"></div>

          <div class="bar">
            <div class="fill" id="fill" style="width: 0%"></div>
          </div>
          <div class="xp" id="xp">0 / 2 XP</div>

          <div class="streak" id="streak"></div>
        </a>
      </section>

      <div class="actions">
        <a class="action primary" href="report.html">
          <span>📷</span>
          <span data-i18n="game.action_find">画像を投稿</span>
        </a>

        <a class="action secondary" href="menu.html">
          <span>🔍</span>
          <span data-i18n="game.action_review">確認・修正</span>
        </a>

        <a class="action" href="map.html">
          <span>🗺️</span>
          <span data-i18n="game.action_map">街を見る</span>
        </a>
      </div>

      <a class="mypage-link" href="mypage.html" data-i18n="game.mypage_full_hint">
        トロフィー・コレクション・図鑑・地域インパクトはマイページで見られます →
      </a>
    </div>

    <div id="levelup-backdrop" class="levelup-backdrop" hidden>
      <div
        class="levelup-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="levelup-title"
      >
        <div class="levelup-poppers" aria-hidden="true">
          <span class="left">🎉</span>
          <span class="right">🎉</span>
        </div>

        <h2
          id="levelup-title"
          class="levelup-title"
          data-i18n="game.levelup_title"
        >
          レベルアップおめでとう！
        </h2>

        <div id="levelup-levels" class="levelup-levels">Lv.5 → Lv.6</div>

        <button
          id="levelup-close"
          class="levelup-close"
          type="button"
          data-i18n="game.levelup_close"
        >
          やった！
        </button>
      </div>
    </div>

    <script type="module">
      import { getUserId, bootstrapAuth } from "./auth.js";
      import { t, applyI18n, initLangSwitcher } from "./i18n.js";

      applyI18n();
      initLangSwitcher();
      document.title = t("game.title");

      let userId = getUserId();
      await bootstrapAuth().then((r) => {
        userId = r.userId;
      });

      const $ = (id) => document.getElementById(id);

      function launchLevelupFireworks() {
        const backdrop = $("levelup-backdrop");
        if (!backdrop) return;

        const colors = [
          "#1a5c3a",
          "#214f69",
          "#d39426",
          "#a23a57",
          "#6d4aa8",
          "#e56d35",
          "#d94f70",
          "#3a8f80",
        ];

        const FIREWORK_COUNT = 12;

        for (let burstIndex = 0; burstIndex < FIREWORK_COUNT; burstIndex++) {
          // Keep the center of each explosion away from the very edge.
          const x = 10 + Math.random() * 80; // 10–90vw
          const y = 10 + Math.random() * 80; // 10–90vh

          // Randomly explode at any point during the next 1.5 seconds.
          const delay = Math.random() * 1500;

          const particleCount = 14 + Math.floor(Math.random() * 7); // 14–20

          for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement("span");

            particle.className = "levelup-firework";
            particle.style.left = `${x}vw`;
            particle.style.top = `${y}vh`;
            particle.style.color =
              colors[Math.floor(Math.random() * colors.length)];

            particle.style.animationDelay = `${delay}ms`;

            particle.style.setProperty(
              "--angle",
              `${i * (360 / particleCount) + Math.random() * 8}deg`,
            );

            particle.style.setProperty(
              "--distance",
              `${45 + Math.random() * 70}px`,
            );

            backdrop.appendChild(particle);

            particle.addEventListener("animationend", () => {
              particle.remove();
            });
          }
        }
      }

      function showLevelup(oldLevel, newLevel) {
        $("levelup-levels").textContent = `Lv.${oldLevel} → Lv.${newLevel}`;
        $("levelup-backdrop").hidden = false;
        requestAnimationFrame(launchLevelupFireworks);
      }

      function checkLevelup(currentLevel) {
        try {
          const key = `tiuc_game_level_${userId}`;
          const previousRaw = localStorage.getItem(key);

          if (previousRaw === null) {
            localStorage.setItem(key, String(currentLevel));
            return;
          }

          const previousLevel = Number(previousRaw);
          localStorage.setItem(key, String(currentLevel));

          if (
            Number.isFinite(previousLevel) &&
            currentLevel > previousLevel
          ) {
            showLevelup(previousLevel, currentLevel);
          }
        } catch {
          // localStorage が使えなくても通常表示を続ける
        }
      }

      $("levelup-close").addEventListener("click", () => {
        $("levelup-backdrop").hidden = true;
      });

      $("levelup-backdrop").addEventListener("click", (event) => {
        if (event.target === $("levelup-backdrop")) {
          $("levelup-backdrop").hidden = true;
        }
      });

      async function loadCharacter() {
        const j = await fetch(`/api/game/character?user_id=${userId}`).then(
          (r) => r.json(),
        );
        if (!j.ok) return;

        $("level").textContent = `Lv.${j.level}`;
        $("title").textContent = t(`game.level_title.${j.title_key}.name`);
        $("xp").textContent = `${j.xp_into_level} / ${j.xp_for_next_level} XP`;
        $("streak").innerHTML = j.streak_count
          ? `🔥 ${t("game.streak_label", { n: j.streak_count })}`
          : "";

        const wrap = $("hero-mon-wrap");
        wrap.className = "hero-mon-wrap";
        if (j.display_species_id) {
          wrap.classList.add(`r${j.display_rarity}`);
          $("hero-mon").hidden = false;
          $("hero-mon-empty").hidden = true;
        } else {
          $("hero-mon").hidden = true;
          $("hero-mon-empty").hidden = false;
        }

        checkLevelup(j.level);

        const p = j.xp_for_next_level
          ? Math.min(
              100,
              Math.round((j.xp_into_level / j.xp_for_next_level) * 100),
            )
          : 0;

        $("fill").style.width = `${p}%`;
      }

      loadCharacter().catch(console.error);
    </script>
  </body>
</html>
