<!doctype html>
<html lang="ja" class="app-html">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <title data-i18n="judge.title">違和感チェック - TIUC</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --app-line: #e3e6df;
      --app-muted: #6b7068;
      --app-text: #1d211d;
      --warn: #a33;
      --ok: #161;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
      color: var(--app-text);
    }
    #points-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-width: max-content;
      white-space: nowrap;
      font-size: 12px;
      border: 1px solid var(--app-line);
      border-radius: var(--radius-pill);
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.6);
      font-weight: 700;
    }
    h1 {
      font-size: 21px;
      margin: 0 0 5px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .lead {
      color: var(--app-muted);
      font-size: 13px;
      margin: 0 0 16px;
      line-height: 1.7;
    }

    #lang-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    #other-lang-wrap {
      margin-bottom: 18px;
    }

    #other-lang-wrap[hidden] {
      display: none;
    }

    #other-lang {
      width: 100%;
      padding: 10px;
      font: inherit;
      border: 1px solid var(--app-line);
      border-radius: var(--radius-sm);
      background: #fff;
    }
    #lang-select button {
      flex: 1;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--app-line);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }
    #lang-select button:hover {
      border-color: #b9c3ba;
    }
    #lang-select button.active {
      background: var(--color-accent, #1a5c3a);
      color: #fff;
      border-color: var(--color-accent, #1a5c3a);
    }

    #card {
      border: 1px solid var(--app-line);
      border-radius: 22px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.04),
        0 10px 30px rgba(18, 28, 20, 0.05);
    }
    #card[hidden] {
      display: none;
    }
    .imgs {
      display: flex;
      gap: 8px;
    }
    .imgs > div {
      flex: 1;
    }
    .imgs img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 14px;
      background: #eee;
      display: block;
    }
    .imgs .cap {
      font-size: 11px;
      color: var(--app-muted);
      text-align: center;
      margin-top: 4px;
    }
    .meta {
      font-size: 12px;
      color: var(--app-muted);
      margin: 10px 0;
    }
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .btns button {
      padding: 18px 8px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 16px;
      border: 2px solid var(--app-line);
      background: #fff;
      cursor: pointer;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
    }
    .btns button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(18, 28, 20, 0.08);
    }
    .btns button.natural {
      border-color: var(--ok);
      color: var(--ok);
    }
    .btns button.unnatural {
      border-color: var(--warn);
      color: var(--warn);
    }
    .btns button:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
      box-shadow: none;
    }
    #skip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 12px;
      padding: 13px 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--app-muted);
      background: rgba(107, 112, 104, 0.06);
      border: 2px dashed var(--app-line);
      border-radius: 16px;
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }
    #skip:hover {
      background: rgba(107, 112, 104, 0.1);
      border-color: #b9c3ba;
    }
    #skip:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--app-muted);
    }
    #empty .icon {
      font-size: 40px;
    }
    .status {
      font-size: 13px;
      color: var(--app-muted);
      margin-top: 10px;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1d211d;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
  <body class="app-body">
    <div class="app-shell">
      <header class="app-topbar">
        <a href="menu.html" class="brand"
          ><span class="brand-mark">T</span
          ><span class="brand-copy"
            ><strong>TIUC</strong
            ><span data-i18n="common.back_curation"
              >← キュレーション</span
            ></span
          ></a
        >
        <div id="topbar-actions">
          <select id="lang-switcher" class="lang-switcher"></select>
          <div id="points-badge">0 pt</div>
        </div>
      </header>
      <h1 data-i18n="judge.h1">🔍 違和感チェック</h1>
      <p class="lead" data-i18n="judge.lead">
        訳文を見て、自然かどうかを一タップで判定してください。母語話者向けです。
      </p>

      <div id="lang-select">
        <button
          type="button"
          data-lang="ja-en"
          class="active"
          data-i18n="common.arrow_lang_en"
        >
          英語
        </button>
        <button
          type="button"
          data-lang="ja-zh"
          data-i18n="common.arrow_lang_zh"
        >
          中国語
        </button>
        <button
          type="button"
          data-lang="ja-ko"
          data-i18n="common.arrow_lang_ko"
        >
          韓国語
        </button>
        <button type="button" data-lang="other" data-i18n="report.place_other">
          その他
        </button>
      </div>
      <div id="other-lang-wrap" hidden>
        <select id="other-lang">
            <option value="" data-i18n="common.unselected">未選択</option>
            <option value="ja-fr">Français</option>
            <option value="ja-es">Español</option>
            <option value="ja-hi">हिन्दी</option>
        </select>
      </div>

      <div id="card" hidden>
        <div class="imgs" id="imgs"></div>
        <p class="meta" id="meta"></p>
        <div class="btns">
          <button
            type="button"
            class="unnatural"
            id="btn-unnatural"
            data-i18n="judge.btn_unnatural"
          >
            😕 不自然
          </button>
          <button
            type="button"
            class="natural"
            id="btn-natural"
            data-i18n="judge.btn_natural"
          >
            🙂 自然
          </button>
        </div>
        <button type="button" id="skip" data-i18n="judge.skip_btn">
          スキップして次へ
        </button>
      </div>

      <div id="empty" hidden>
        <p class="icon">🎉</p>
        <p data-i18n-html="judge.empty_text">
          今この言語ペアで判定できる投稿はありません。<br />ほかの言語ペアを試すか、また後で来てください。
        </p>
      </div>

      <p class="status" id="status"></p>
      <div class="toast" id="toast"></div>

      <script type="module">
        import { getUserId, bootstrapAuth } from "./auth.js";
        import { t, applyI18n, initLangSwitcher } from "./i18n.js";
        import "./track.js";

        applyI18n();
        initLangSwitcher();

        let userId = getUserId();
        const authReady = bootstrapAuth().then((r) => {
          userId = r.userId;
        });
        const $ = (id) => document.getElementById(id);

        let langPair = "ja-en";
        let current = null;
        const seen = [];

        // 地図などから lang_pair 指定で来た場合は、主要3言語か「その他」を自動選択する
        const urlLangPair = new URLSearchParams(location.search).get("lang_pair");
        if (urlLangPair) {
          const directBtn = document.querySelector(
            `#lang-select button[data-lang="${urlLangPair}"]`,
          );

          if (directBtn) {
            document
              .querySelectorAll("#lang-select button")
              .forEach((b) => b.classList.remove("active"));
            directBtn.classList.add("active");
            langPair = urlLangPair;
          } else {
            const otherBtn = document.querySelector(
              '#lang-select button[data-lang="other"]',
            );
            const otherOption = document.querySelector(
              `#other-lang option[value="${urlLangPair}"]`,
            );

            if (otherBtn && otherOption) {
              document
                .querySelectorAll("#lang-select button")
                .forEach((b) => b.classList.remove("active"));
              otherBtn.classList.add("active");
              $("other-lang-wrap").hidden = false;
              $("other-lang").value = urlLangPair;
              langPair = urlLangPair;
            }
          }
        }

        async function loadPointsBadge() {
          try {
            const res = await fetch(`/api/mypage?user_id=${userId}`);
            const j = await res.json();
            if (j.ok)
              $("points-badge").textContent =
                `${j.summary.points_total} pt / Lv.${j.summary.level}`;
          } catch {
            /* バッジのみ */
          }
        }

        function showToast(text) {
          const t = $("toast");
          t.textContent = text;
          t.classList.add("show");
          setTimeout(() => t.classList.remove("show"), 1200);
        }

        document.querySelectorAll("#lang-select button").forEach((btn) => {
          btn.addEventListener("click", () => {
            document
              .querySelectorAll("#lang-select button")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");

            if (btn.dataset.lang === "other") {
              $("other-lang-wrap").hidden = false;
              if (!$("other-lang").value) {
                $("card").hidden = true;
                $("empty").hidden = true;
                $("status").textContent = "";
                current = null;
                return;
              }
              langPair = $("other-lang").value;
            } else {
              $("other-lang-wrap").hidden = true;
              langPair = btn.dataset.lang;
            }

            seen.length = 0;
            loadNext();
          });
        });

        $("other-lang").addEventListener("change", () => {
          if (!$("other-lang").value) {
            $("card").hidden = true;
            $("empty").hidden = true;
            $("status").textContent = "";
            current = null;
            return;
          }

          langPair = $("other-lang").value;
          seen.length = 0;
          loadNext();
        });

        async function loadNext() {
          $("status").textContent = t("common.loading");
          $("card").hidden = true;
          $("empty").hidden = true;
          await authReady;
          try {
            const params = new URLSearchParams({
              user_id: userId,
              lang_pair: langPair,
              exclude: seen.slice(-20).join(","),
            });
            const res = await fetch(`/api/judge/next?${params}`);
            const j = await res.json();
            if (!j.ok) throw new Error(j.error || t("common.fetch_error"));
            $("status").textContent = "";
            if (!j.post) {
              $("empty").hidden = false;
              current = null;
              return;
            }
            current = j.post;
            $("imgs").innerHTML =
              `<div><img src="${current.src_thumb_url}" alt="${t("common.alt_translated")}"><p class="cap">${t("common.alt_translated")}</p></div>` +
              (current.tgt_thumb_url
                ? `<div><img src="${current.tgt_thumb_url}" alt="${t("common.alt_original")}"><p class="cap">${t("common.alt_original")}</p></div>`
                : "");
            $("meta").textContent = current.situation
              ? t("common.memo_prefix", { text: current.situation })
              : "";
            $("card").hidden = false;
          } catch (e) {
            $("status").textContent = e.message;
          }
        }

        async function submit(verdict) {
          if (!current) return;
          document
            .querySelectorAll(".btns button")
            .forEach((b) => (b.disabled = true));
          try {
            const res = await fetch("/api/judge/submit", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                user_id: userId,
                post_id: current.post_id,
                verdict,
              }),
            });
            const j = await res.json();
            if (!j.ok) throw new Error(j.error);
            showToast(
              `+${j.points}pt +1🎴` +
                (j.transitioned_to ? t("judge.toast_dispatched") : ""),
            );
            loadPointsBadge();
            seen.push(current.post_id);
            loadNext();
          } catch (e) {
            $("status").textContent = e.message;
          } finally {
            document
              .querySelectorAll(".btns button")
              .forEach((b) => (b.disabled = false));
          }
        }

        $("btn-natural").addEventListener("click", () => submit("natural"));
        $("btn-unnatural").addEventListener("click", () => submit("unnatural"));
        $("skip").addEventListener("click", () => {
          if (current) seen.push(current.post_id);
          loadNext();
        });

        authReady.then(() => {
          loadPointsBadge();
          loadNext();
        });
      </script>
    </div>
  </body>
</html>
