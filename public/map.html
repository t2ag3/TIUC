<!doctype html>
<html lang="ja" class="app-html">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <title data-i18n="map.title">マップ - TIUC</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --app-line: #e3e6df;
      --app-muted: #6b7068;
      --app-text: #1d211d;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--app-text);
      background: #f7f8f5;
    }

    #topbar {
      position: sticky;
      z-index: 2;
      top: 0;
      background: rgba(247, 248, 245, 0.94);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--app-line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
    }
    #topbar-row1 {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
    }
    #topbar-row1 .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      flex: none;
    }
    #topbar-row1 .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--color-accent, #1a5c3a);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      flex: none;
    }
    #topbar-row1 h1 {
      font-size: 14px;
      font-weight: 800;
      margin: 0;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #topbar-row2 {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 36px;
    }
    #status-msg {
      font-size: 11px;
      color: var(--app-muted);
      white-space: nowrap;
      flex: none;
    }
    .icon-btn {
      flex: none;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      background: #f5f6f3;
      border: 1px solid var(--app-line);
      border-radius: 10px;
      padding: 0 12px;
      height: 34px;
      cursor: pointer;
      color: var(--app-text);
      transition: background 0.15s ease;
    }
    .icon-btn:hover {
      background: #eceee9;
    }
    .icon-btn.active {
      background: #1d211d;
      color: #fff;
      border-color: #1d211d;
    }
    .icon-btn .glyph {
      font-size: 14px;
      line-height: 1;
    }
    .icon-btn svg.glyph {
      display: block;
      flex: none;
    }

    #place-row {
      display: flex;
      gap: 6px;
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
    }
    #place-row input[type="text"] {
      flex: 1 1 auto;
      min-width: 40px;
      font-size: 13px;
      padding: 0 10px;
      border: 1px solid var(--app-line);
      border-radius: 10px;
    }
    #place-row button {
      flex: none;
      font-size: 12px;
      font-weight: 700;
      padding: 0 12px;
      border: 1px solid var(--app-line);
      border-radius: 10px;
      background: #f5f6f3;
      cursor: pointer;
    }
    #place-msg {
      margin: 0;
      padding: 0 2px;
      font-size: 11px;
      color: #a33;
    }
    #place-msg:empty {
      display: none;
    }

    .dropdown {
      position: absolute;
      z-index: 1000;
      top: 92px;
      right: 10px;
      width: min(300px, calc(100vw - 20px));
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--app-line);
      border-radius: 16px;
      padding: 14px;
      font-size: 13px;
      box-shadow: 0 16px 50px rgba(18, 28, 20, 0.14);
      display: none;
    }
    .dropdown.open {
      display: block;
    }
    .dropdown h2 {
      font-size: 12px;
      color: var(--app-muted);
      margin: 14px 0 6px;
      font-weight: 700;
    }
    .dropdown h2:first-child {
      margin-top: 0;
    }
    .dropdown p.hint {
      font-size: 11px;
      color: var(--app-muted);
      margin: 0 0 8px;
      line-height: 1.6;
    }
    #search .lang label,
    #search .status label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      cursor: pointer;
    }
    .num-filter {
      width: 100%;
      font-size: 13px;
      padding: 7px 9px;
      border: 1px solid var(--app-line);
      border-radius: 10px;
    }

    /* ---- カードリスト ---- */
    #list {
      padding: 12px 12px 32px;
    }
    .post-card {
      display: flex;
      gap: 12px;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid var(--app-line);
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.04),
        0 6px 18px rgba(18, 28, 20, 0.05);
      transition:
        border-color 0.15s ease,
        transform 0.15s ease;
    }
    .post-card:hover {
      border-color: #b9c3ba;
      transform: translateY(-1px);
    }
    .post-card-thumb {
      position: relative;
      flex: none;
      width: 84px;
      height: 84px;
      border-radius: 12px;
      overflow: hidden;
      background: #eceee9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .post-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .post-card-thumb .ph-icon {
      font-size: 26px;
      opacity: 0.5;
    }
    .post-card-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .post-card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .post-card-lang {
      flex: none;
      font-size: 11px;
      font-weight: 700;
      color: var(--color-accent, #1a5c3a);
    }
    .post-card-status {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .post-card-text {
      font-size: 13px;
      margin-top: 3px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .post-card-date {
      font-size: 11px;
      color: var(--app-muted);
      margin-top: 5px;
    }
    .post-card-loc {
      font-size: 11px;
      color: var(--app-muted);
      margin-top: 2px;
    }
    .post-card-loc:empty {
      display: none;
    }
    .list-empty {
      text-align: center;
      color: var(--app-muted);
      font-size: 13px;
      padding: 40px 0;
    }
    .load-more-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--app-line);
      border-radius: 14px;
      background: #fff;
      color: var(--app-text);
      cursor: pointer;
    }
    .load-more-btn:hover {
      border-color: #b9c3ba;
      background: #f6f8f5;
    }

    #legend .swatches {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 4px;
    }
    #legend .sw {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    #legend .sw i.dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      border: 1.5px solid #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
    }

    /* ---- 詳細モーダル ---- */
    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(18, 28, 20, 0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .detail-overlay[hidden] {
      display: none;
    }
    .detail-modal {
      position: relative;
      width: 100%;
      max-width: 460px;
      max-height: 88vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 22px 22px 0 0;
      padding: 20px 18px 24px;
      box-shadow: 0 -10px 40px rgba(18, 28, 20, 0.2);
    }
    @media (min-width: 520px) {
      .detail-overlay {
        align-items: center;
        padding: 16px;
      }
      .detail-modal {
        border-radius: 22px;
      }
    }
    .detail-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--app-line);
      background: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .popup-photo {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
      display: block;
    }
    .popup-explanation {
      margin: 8px 0 0;
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }
    .popup-like-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    .popup-like-btn {
      border: 1px solid var(--app-line);
      background: #f5f6f3;
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .popup-like-btn.liked {
      background: #fde8e8;
      border-color: #e2a3a3;
    }
    .popup-cta {
      display: block;
      margin-top: 10px;
      padding: 10px 10px;
      text-align: center;
      border-radius: 10px;
      background: var(--color-accent, #1a5c3a);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .detail-table {
      border-collapse: collapse;
      font-size: 13px;
      width: 100%;
    }
    .detail-table td {
      padding: 4px 8px 4px 0;
      vertical-align: top;
    }
    .detail-table td:first-child {
      color: var(--app-muted);
      white-space: nowrap;
    }
    .detail-goto {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
  <body>
    <div id="topbar">
      <div id="topbar-row1">
        <a class="brand" href="/"><span class="brand-mark">T</span></a>
        <h1 data-i18n="map.h1">TIUC マップ</h1>
        <span id="status-msg"></span>
        <select
          id="lang-switcher"
          class="lang-switcher"
          style="height: 28px"
        ></select>
      </div>
      <div id="topbar-row2">
        <div id="place-row">
          <input
            type="text"
            id="place-q"
            data-i18n-placeholder="map.place_placeholder"
            placeholder="地名・住所で検索(例: 新宿区)"
          />
          <button type="button" id="place-go" data-i18n="map.search_btn">
            検索
          </button>
        </div>
        <button type="button" id="search-toggle" class="icon-btn">
          <svg
            class="glyph"
            width="13"
            height="13"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M1.5 2h13l-4.8 6v5.2L7.3 15V8L1.5 2Z"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
              fill="none"
            />
          </svg>
          <span data-i18n="map.filter_btn">フィルタ</span>
        </button>
        <button type="button" id="legend-toggle" class="icon-btn">
          <span class="glyph">🗂</span
          ><span data-i18n="map.legend_btn">凡例</span>
        </button>
      </div>
      <p id="place-msg"></p>

      <div id="search" class="dropdown">
        <h2 data-i18n="map.status_filter_header">状態</h2>
        <div class="status" id="status-filters"></div>
        <h2 data-i18n="map.lang_pair_header">言語ペア</h2>
        <div class="lang" id="lang-filters"></div>
        <h2 data-i18n="map.min_likes_header">最低いいね数</h2>
        <input
          type="number"
          id="min-likes"
          class="num-filter"
          min="0"
          step="1"
          value="0"
        />
        <h2 data-i18n="map.min_agree_header">最低賛成数(修正案)</h2>
        <input
          type="number"
          id="min-agree"
          class="num-filter"
          min="0"
          step="1"
          value="0"
        />
      </div>

      <div id="legend" class="dropdown">
        <h2 data-i18n="map.legend_pin_header">状態の色分け</h2>
        <div class="swatches" id="pin-legend"></div>
        <p class="hint" data-i18n="map.legend_leaning_hint">
          「審査中」の投稿は、違和感チェックの票が入り始めると
          「違和感あり/なし(暫定)」の表示に自動で変わります。
        </p>
      </div>
    </div>

    <div id="list">
      <div id="list-items"></div>
      <p id="list-empty" class="list-empty" hidden data-i18n="map.list_empty">
        該当する投稿がありません。フィルタや検索条件を変えてみてください。
      </p>
      <button type="button" id="load-more" class="load-more-btn" hidden>
        <span data-i18n="map.load_more_btn">もっと見る</span>
      </button>
    </div>

    <div id="detail-overlay" class="detail-overlay" hidden>
      <div id="detail-modal" class="detail-modal">
        <button
          type="button"
          id="detail-close"
          class="detail-close"
          aria-label="close"
        >
          ✕
        </button>
        <div id="detail-body"></div>
      </div>
    </div>

    <script type="module">
      import { t, applyI18n, initLangSwitcher } from "./i18n.js";
      import { getUserId } from "./auth.js";

      applyI18n();
      initLangSwitcher();

      const $ = (id) => document.getElementById(id);
      const userId = getUserId();

      // 地図が無いため、地域絞り込みは「地名検索」でだけ行う。
      // 未検索時は日本全国(postsのlat/lng CHECK制約と同じ範囲)を対象にする。
      const NATIONAL_BBOX = { west: 122, south: 20, east: 154, north: 46 };

      const LANG_LABEL = {
        "ja-en": t("common.pair_label_en"),
        "ja-zh": t("common.pair_label_zh"),
        "ja-ko": t("common.pair_label_ko"),
        "ja-fr": t("common.pair_label_fr"),
        "ja-es": t("common.pair_label_es"),
        "ja-hi": t("common.pair_label_hi"),
      };

      const jstLocale = {
        ja: "ja-JP",
        en: "en-US",
        zh: "zh-CN",
        fr: "fr-FR",
        es: "es-ES",
        ko: "ko-KR",
      };
      const jst = (ts) =>
        ts
          ? new Date(ts * 1000).toLocaleDateString(
              jstLocale[document.documentElement.lang] || "ja-JP",
              {
                timeZone: "Asia/Tokyo",
                year: "numeric",
                month: "numeric",
                day: "numeric",
              },
            )
          : "—";

      const googleMapsUrl = (lat, lng) =>
        `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

      // ステータス別の色・ラベル。カードバッジ・凡例・フィルタ・詳細で単一の情報源にする。
      const STATUS_STYLE = {
        pending_judgment: {
          color: "#c9a227",
          label: t("map.status_reviewing"),
        },
        needs_fix: { color: "#c9a227", label: t("map.status_fix_proposed") },
        looks_ok: { color: "#8a8478", label: t("map.status_looks_ok") },
        confirmed: { color: "#2e6da4", label: t("map.status_confirmed") },
        adopted: { color: "#1a4d73", label: t("map.status_adopted") },
      };
      const PIN_DEFAULT_COLOR = "#8a8478";

      // 表示専用の暫定リーン(rule12改定)。posts.statusはpending_judgmentのまま変えず、
      // 違和感チェックの票が1件以上入っていればカード表示だけ先取りして見せる。
      function displayStatus(p) {
        if (
          p.status === "pending_judgment" &&
          (p.natural_count > 0 || p.unnatural_count > 0) &&
          p.natural_count !== p.unnatural_count
        ) {
          return p.unnatural_count > p.natural_count
            ? { color: "#c9a227", label: t("map.status_leaning_unnatural") }
            : { color: "#8a8478", label: t("map.status_leaning_natural") };
        }
        return STATUS_STYLE[p.status] || {};
      }

      for (const [k, s] of Object.entries(STATUS_STYLE)) {
        $("pin-legend").insertAdjacentHTML(
          "beforeend",
          `<div class="sw"><i class="dot" style="background:${s.color}"></i>${s.label}</div>`,
        );
        $("status-filters").insertAdjacentHTML(
          "beforeend",
          `<label><input type="checkbox" value="${k}" checked>${s.label}</label>`,
        );
      }

      for (const [k, label] of Object.entries(LANG_LABEL)) {
        $("lang-filters").insertAdjacentHTML(
          "beforeend",
          `<label><input type="checkbox" value="${k}" checked>${label}</label>`,
        );
      }

      function setStatus(text) {
        $("status-msg").textContent = text || "";
      }

      function closeDropdowns() {
        $("search").classList.remove("open");
        $("legend").classList.remove("open");
        $("search-toggle").classList.remove("active");
        $("legend-toggle").classList.remove("active");
      }
      function toggleDropdown(panelId, btnId) {
        const opening = !$(panelId).classList.contains("open");
        closeDropdowns();
        if (opening) {
          $(panelId).classList.add("open");
          $(btnId).classList.add("active");
        }
      }
      $("search-toggle").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleDropdown("search", "search-toggle");
      });
      $("legend-toggle").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleDropdown("legend", "legend-toggle");
      });
      document
        .querySelectorAll(".dropdown")
        .forEach((el) =>
          el.addEventListener("click", (e) => e.stopPropagation()),
        );
      document.addEventListener("click", closeDropdowns);

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      const REVIEWABLE = new Set(["ja-en", "ja-zh", "ja-ko"]);

      function confirmedDetailHtml(p, coords) {
        const photo = p.src_thumb_key
          ? `<img class="popup-photo" src="/img/${p.src_thumb_key}" alt="${escapeHtml(t("common.alt_translated"))}">`
          : "";
        const style = displayStatus(p);
        return `${photo}<table class="detail-table">
        <tr><td>${t("map.row_status")}</td><td>${escapeHtml(style.label || p.status)}</td></tr>
        <tr><td>${t("map.row_lang")}</td><td>${LANG_LABEL[p.lang_pair] || p.lang_pair}</td></tr>
        <tr><td>${t("map.row_original")}</td><td>${escapeHtml(p.original_text || t("map.not_entered"))}</td></tr>
        <tr><td>${t("map.label_confirmed_translation")}</td><td>${escapeHtml(p.translated_text || t("map.not_entered"))}</td></tr>
        <tr><td>${t("map.row_date")}</td><td>${jst(p.event_at)}</td></tr>
      </table>
      ${p.explanation ? `<p class="popup-explanation">${escapeHtml(p.explanation)}</p>` : ""}
      <div class="popup-like-row">
        <button type="button" class="popup-like-btn" id="like-btn-${p.id}">👍 ${t("map.like_btn")}</button>
        <span id="like-count-${p.id}">${p.like_count}</span>
      </div>
      <p class="detail-goto"><a href="${googleMapsUrl(coords[1], coords[0])}"
        target="_blank" rel="noopener">${t("map.goto_link")}</a></p>`;
      }

      function pendingDetailHtml(p, coords) {
        let cta = "";
        if (REVIEWABLE.has(p.lang_pair)) {
          if (p.status === "pending_judgment") {
            cta = `<a class="popup-cta" href="judge.html?lang_pair=${encodeURIComponent(p.lang_pair)}">${t("map.goto_judge_cta")}</a>`;
          } else if (p.status === "needs_fix") {
            cta = `<a class="popup-cta" href="curate.html?lang_pair=${encodeURIComponent(p.lang_pair)}">${t("map.goto_curate_cta")}</a>`;
          }
        }
        const style = displayStatus(p);
        return `<table class="detail-table">
        <tr><td>${t("map.row_status")}</td><td>${escapeHtml(style.label || p.status)}</td></tr>
        <tr><td>${t("map.row_lang")}</td><td>${LANG_LABEL[p.lang_pair] || p.lang_pair}</td></tr>
        <tr><td>${t("map.row_original")}</td><td>${escapeHtml(p.original_text || t("map.not_entered"))}</td></tr>
        <tr><td>${t("map.label_unconfirmed_translation")}</td><td>${escapeHtml(p.translated_text || t("map.not_entered"))}</td></tr>
        <tr><td>${t("map.row_date")}</td><td>${jst(p.event_at)}</td></tr>
      </table>
      ${cta}
      <p class="detail-goto"><a href="${googleMapsUrl(coords[1], coords[0])}"
        target="_blank" rel="noopener">${t("map.goto_link")}</a></p>`;
      }

      function wireLikeButton(p) {
        const btn = document.getElementById(`like-btn-${p.id}`);
        if (!btn) return;
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            const res = await fetch("/api/posts/like", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ user_id: userId, post_id: p.id }),
            });
            const j = await res.json();
            if (!j.ok) throw new Error(j.error);
            p.like_count = j.count;
            btn.classList.toggle("liked", j.liked);
            const countEl = document.getElementById(`like-count-${p.id}`);
            if (countEl) countEl.textContent = j.count;
          } catch {
            /* 失敗しても閲覧自体は継続できる */
          } finally {
            btn.disabled = false;
          }
        });
      }

      function openDetail(feature) {
        const p = feature.properties;
        const coords = feature.geometry.coordinates;
        const isConfirmed = p.status === "confirmed" || p.status === "adopted";
        $("detail-body").innerHTML = isConfirmed
          ? confirmedDetailHtml(p, coords)
          : pendingDetailHtml(p, coords);
        if (isConfirmed) wireLikeButton(p);
        $("detail-overlay").hidden = false;
      }
      function closeDetail() {
        $("detail-overlay").hidden = true;
        $("detail-body").innerHTML = "";
      }
      $("detail-close").addEventListener("click", closeDetail);
      $("detail-overlay").addEventListener("click", (e) => {
        if (e.target === $("detail-overlay")) closeDetail();
      });

      // カードの「〇〇県〇〇区」表示。posts自体には住所を持たせず(rule1: 座標は1つだけ)、
      // 表示時にGSIの逆ジオコーダ+市区町村コード表(muni-codes.json、geolonia/japanese-addresses
      // 由来)で都度その場粒度に変換する。近傍の投稿はキャッシュを共有し、重複した外部呼び出しをしない。
      let muniTablePromise = null;
      function loadMuniTable() {
        if (!muniTablePromise) {
          muniTablePromise = fetch("muni-codes.json").then((r) => r.json());
        }
        return muniTablePromise;
      }
      const locCache = new Map();
      function resolveLocation(lat, lng) {
        const key = `${lat.toFixed(3)},${lng.toFixed(3)}`;
        if (!locCache.has(key)) {
          locCache.set(
            key,
            (async () => {
              try {
                const [table, res] = await Promise.all([
                  loadMuniTable(),
                  fetch(
                    `https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`,
                  ),
                ]);
                const j = await res.json();
                const muniCd = j?.results?.muniCd;
                const entry = muniCd && table[muniCd];
                return entry ? entry.join("") : "";
              } catch {
                return "";
              }
            })(),
          );
        }
        return locCache.get(key);
      }

      function cardHtml(feature) {
        const p = feature.properties;
        const style = displayStatus(p);
        const langLabel = LANG_LABEL[p.lang_pair] || p.lang_pair;
        const thumb = p.src_thumb_key
          ? `<img src="/img/${p.src_thumb_key}" alt="">`
          : `<span class="ph-icon">📍</span>`;
        return `
          <div class="post-card" data-id="${p.id}">
            <div class="post-card-thumb">
              ${thumb}
            </div>
            <div class="post-card-body">
              <div class="post-card-badges">
                <span class="post-card-lang">${escapeHtml(langLabel)}</span>
                <span class="post-card-status" style="background:${style.color || PIN_DEFAULT_COLOR}">${escapeHtml(style.label || p.status)}</span>
              </div>
              <div class="post-card-text">${escapeHtml(p.original_text || t("map.not_entered"))}</div>
              <div class="post-card-loc" id="loc-${p.id}"></div>
              <div class="post-card-date">${jst(p.event_at)}</div>
            </div>
          </div>
        `;
      }

      const featuresById = new Map();
      function addCard(feature) {
        featuresById.set(feature.properties.id, feature);
        $("list-items").insertAdjacentHTML("beforeend", cardHtml(feature));
        const [lng, lat] = feature.geometry.coordinates;
        resolveLocation(lat, lng).then((label) => {
          if (!label) return;
          const el = document.getElementById(`loc-${feature.properties.id}`);
          if (el) el.textContent = label;
        });
      }

      $("list-items").addEventListener("click", (e) => {
        const card = e.target.closest(".post-card");
        if (!card) return;
        const feature = featuresById.get(card.dataset.id);
        if (feature) openDetail(feature);
      });

      function checkedValues(containerId) {
        return [
          ...document.querySelectorAll(`#${containerId} input:checked`),
        ].map((el) => el.value);
      }

      let currentBbox = NATIONAL_BBOX;
      let offset = 0;
      let controller = null;

      async function runQuery(reset) {
        if (controller) controller.abort();
        controller = new AbortController();

        if (reset) offset = 0;

        const langs = checkedValues("lang-filters");
        const statuses = checkedValues("status-filters");
        const minLikes = Math.max(0, Number($("min-likes").value) || 0);
        const minAgree = Math.max(0, Number($("min-agree").value) || 0);
        const b = currentBbox;
        const params = new URLSearchParams({
          bbox: [b.west, b.south, b.east, b.north].join(","),
          level: "mesh3",
          lang_pair: langs.join(","),
          status: statuses.join(","),
          min_likes: String(minLikes),
          min_agree: String(minAgree),
          limit: "30",
          offset: String(offset),
        });

        setStatus(t("common.loading"));
        try {
          const res = await fetch(`/api/map?${params}`, {
            signal: controller.signal,
          });
          const geojson = await res.json();
          if (!res.ok)
            throw new Error(geojson.error || t("common.fetch_error"));

          const pins = geojson.features.filter(
            (f) => f.properties.kind === "pin",
          );

          if (reset) {
            $("list-items").innerHTML = "";
            featuresById.clear();
          }
          for (const f of pins) addCard(f);
          offset += pins.length;
          $("load-more").hidden = !geojson.has_more;
          if (reset) {
            $("list-empty").hidden = pins.length > 0;
          }
          setStatus("");
        } catch (e) {
          if (e.name === "AbortError") return;
          setStatus(e.message);
        }
      }

      let debounceTimer = null;
      function scheduleRefresh() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => runQuery(true), 300);
      }
      document
        .querySelectorAll("#lang-filters input, #status-filters input")
        .forEach((el) => el.addEventListener("change", scheduleRefresh));
      $("min-likes").addEventListener("input", scheduleRefresh);
      $("min-agree").addEventListener("input", scheduleRefresh);

      $("load-more").addEventListener("click", () => runQuery(false));

      // 地図が無いので「地名検索」は、その地点周辺のbboxに絞り込む役割を持つ。
      // 検索欄を空にして再検索すると全国表示に戻る。
      const PLACE_RADIUS_DEG = 0.05;
      async function searchPlace() {
        const q = $("place-q").value.trim();
        const msg = $("place-msg");
        msg.textContent = "";
        if (!q) {
          currentBbox = NATIONAL_BBOX;
          runQuery(true);
          return;
        }
        msg.textContent = t("map.searching");
        try {
          const res = await fetch(
            `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`,
          );
          if (!res.ok) throw new Error(t("map.search_failed"));
          const results = await res.json();
          if (!results.length) {
            msg.textContent = t("map.not_found");
            return;
          }
          const [lng, lat] = results[0].geometry.coordinates;
          currentBbox = {
            west: lng - PLACE_RADIUS_DEG,
            east: lng + PLACE_RADIUS_DEG,
            south: lat - PLACE_RADIUS_DEG,
            north: lat + PLACE_RADIUS_DEG,
          };
          msg.textContent = "";
          runQuery(true);
        } catch (e) {
          msg.textContent = e.message;
        }
      }
      $("place-go").addEventListener("click", searchPlace);
      $("place-q").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          searchPlace();
        }
      });

      runQuery(true);
    </script>
  </body>
</html>
