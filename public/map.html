<!doctype html>
<html lang="ja" class="app-html">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <title data-i18n="map.title">マップ - TIUC</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --app-line: #e3e6df;
      --app-muted: #6b7068;
      --app-text: #1d211d;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      height: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--app-text);
    }
    body {
      display: flex;
      flex-direction: column;
    }

    #map-wrap {
      position: relative;
      flex: none;
      height: 42vh;
      min-height: 260px;
    }
    #map {
      position: absolute;
      inset: 0;
    }

    #topbar {
      position: absolute;
      z-index: 2;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      border: 1px solid var(--app-line);
      border-radius: 18px;
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.04),
        0 10px 30px rgba(18, 28, 20, 0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
    }
    #topbar-row1 {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 30px;
    }
    #topbar-row1 .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      flex: none;
    }
    #topbar-row1 .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--color-accent, #1a5c3a);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      flex: none;
    }
    #topbar-row1 h1 {
      font-size: 14px;
      font-weight: 800;
      margin: 0;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #topbar-row2 {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 36px;
    }
    #status-msg {
      font-size: 11px;
      color: var(--app-muted);
      white-space: nowrap;
      flex: none;
    }
    .icon-btn {
      flex: none;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      background: #f5f6f3;
      border: 1px solid var(--app-line);
      border-radius: 10px;
      padding: 0 12px;
      height: 34px;
      cursor: pointer;
      color: var(--app-text);
      transition: background 0.15s ease;
    }
    .icon-btn:hover {
      background: #eceee9;
    }
    .icon-btn.active {
      background: #1d211d;
      color: #fff;
      border-color: #1d211d;
    }
    .icon-btn .glyph {
      font-size: 14px;
      line-height: 1;
    }

    #place-row {
      display: flex;
      gap: 6px;
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
    }
    #place-row input[type="text"] {
      flex: 1 1 auto;
      min-width: 40px;
      font-size: 13px;
      padding: 0 10px;
      border: 1px solid var(--app-line);
      border-radius: 10px;
    }
    #place-row button {
      flex: none;
      font-size: 12px;
      font-weight: 700;
      padding: 0 12px;
      border: 1px solid var(--app-line);
      border-radius: 10px;
      background: #f5f6f3;
      cursor: pointer;
    }
    #place-msg {
      position: absolute;
      z-index: 1000;
      top: 112px;
      left: 20px;
      right: 20px;
      margin: 0;
      font-size: 11px;
      color: #a33;
      background: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      box-shadow: 0 4px 12px rgba(18, 28, 20, 0.1);
    }
    #place-msg:empty {
      display: none;
    }

    .dropdown {
      position: absolute;
      z-index: 1000;
      top: 112px;
      right: 10px;
      width: min(300px, calc(100vw - 20px));
      max-height: calc(100vh - 140px);
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--app-line);
      border-radius: 16px;
      padding: 14px;
      font-size: 13px;
      box-shadow: 0 16px 50px rgba(18, 28, 20, 0.14);
      display: none;
    }
    .dropdown.open {
      display: block;
    }
    .dropdown h2 {
      font-size: 12px;
      color: var(--app-muted);
      margin: 14px 0 6px;
      font-weight: 700;
    }
    .dropdown h2:first-child {
      margin-top: 0;
    }
    #search .lang label,
    #search .status label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      cursor: pointer;
    }
    .num-filter {
      width: 100%;
      font-size: 13px;
      padding: 7px 9px;
      border: 1px solid var(--app-line);
      border-radius: 10px;
    }

    #search-area-btn {
      position: absolute;
      z-index: 900;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #1d211d;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    .popup-photo {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 8px;
      display: block;
    }
    .popup-explanation {
      margin: 8px 0 0;
      color: #555;
    }
    .popup-like-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .popup-like-btn {
      border: 1px solid var(--app-line);
      background: #f5f6f3;
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .popup-like-btn.liked {
      background: #fde8e8;
      border-color: #e2a3a3;
    }
    .popup-cta {
      display: block;
      margin-top: 8px;
      padding: 9px 10px;
      text-align: center;
      border-radius: 10px;
      background: var(--color-accent, #1a5c3a);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    #legend .swatches {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 4px;
    }
    #legend .sw {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    #legend .sw i.dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      border: 1.5px solid #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
    }

    .leaflet-popup-content {
      font-size: 13px;
      margin: 10px 12px;
    }
    .leaflet-popup-content table {
      border-collapse: collapse;
    }
    .leaflet-popup-content td {
      padding: 2px 6px 2px 0;
      vertical-align: top;
    }
    .leaflet-popup-content td:first-child {
      color: var(--app-muted);
      white-space: nowrap;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 16px;
    }

    /* ---- カードリスト ---- */
    #list {
      flex: 1 1 auto;
      overflow-y: auto;
      background: #f7f8f5;
      padding: 12px 12px 32px;
    }
    .post-card {
      display: flex;
      gap: 12px;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid var(--app-line);
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.04),
        0 6px 18px rgba(18, 28, 20, 0.05);
      transition:
        border-color 0.15s ease,
        transform 0.15s ease;
    }
    .post-card:hover {
      border-color: #b9c3ba;
      transform: translateY(-1px);
    }
    .post-card-thumb {
      position: relative;
      flex: none;
      width: 84px;
      height: 84px;
      border-radius: 12px;
      overflow: hidden;
      background: #eceee9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .post-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .post-card-thumb .ph-icon {
      font-size: 26px;
      opacity: 0.5;
    }
    .post-card-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .post-card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .post-card-lang {
      flex: none;
      font-size: 11px;
      font-weight: 700;
      color: var(--color-accent, #1a5c3a);
    }
    .post-card-status {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .post-card-text {
      font-size: 13px;
      margin-top: 3px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .post-card-date {
      font-size: 11px;
      color: var(--app-muted);
      margin-top: 5px;
    }
    .list-empty {
      text-align: center;
      color: var(--app-muted);
      font-size: 13px;
      padding: 40px 0;
    }
    .load-more-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--app-line);
      border-radius: 14px;
      background: #fff;
      color: var(--app-text);
      cursor: pointer;
    }
    .load-more-btn:hover {
      border-color: #b9c3ba;
      background: #f6f8f5;
    }
    [hidden] {
      display: none !important;
    }
  </style>
  <body>
    <div id="map-wrap">
      <div id="map"></div>

      <div id="topbar">
        <div id="topbar-row1">
          <a class="brand" href="/"><span class="brand-mark">T</span></a>
          <h1 data-i18n="map.h1">TIUC マップ</h1>
          <span id="status-msg"></span>
          <select
            id="lang-switcher"
            class="lang-switcher"
            style="height: 28px"
          ></select>
        </div>
        <div id="topbar-row2">
          <div id="place-row">
            <input
              type="text"
              id="place-q"
              data-i18n-placeholder="map.place_placeholder"
              placeholder="地名・住所で検索(例: 新宿区)"
            />
            <button type="button" id="place-go" data-i18n="map.search_btn">
              検索
            </button>
          </div>
          <button type="button" id="search-toggle" class="icon-btn">
            <span class="glyph">⚙️</span
            ><span data-i18n="map.lang_filter_btn">言語</span>
          </button>
          <button type="button" id="legend-toggle" class="icon-btn">
            <span class="glyph">🗂</span
            ><span data-i18n="map.legend_btn">凡例</span>
          </button>
        </div>
      </div>
      <p id="place-msg"></p>

      <div id="search" class="dropdown">
        <h2 data-i18n="map.status_filter_header">状態</h2>
        <div class="status" id="status-filters"></div>
        <h2 data-i18n="map.lang_pair_header">言語ペア</h2>
        <div class="lang" id="lang-filters"></div>
        <h2 data-i18n="map.min_likes_header">最低いいね数</h2>
        <input
          type="number"
          id="min-likes"
          class="num-filter"
          min="0"
          step="1"
          value="0"
        />
        <h2 data-i18n="map.min_agree_header">最低賛成数(修正案)</h2>
        <input
          type="number"
          id="min-agree"
          class="num-filter"
          min="0"
          step="1"
          value="0"
        />
      </div>

      <div id="legend" class="dropdown">
        <h2 data-i18n="map.legend_pin_header">状態の色分け</h2>
        <div class="swatches" id="pin-legend"></div>
      </div>

      <button type="button" id="search-area-btn" hidden>
        <span data-i18n="map.search_area_btn">この範囲を検索</span>
      </button>
    </div>

    <div id="list">
      <div id="list-items"></div>
      <p id="list-empty" class="list-empty" hidden data-i18n="map.list_empty">
        この範囲には投稿がありません。パンや検索でエリアを変えてみてください。
      </p>
      <button type="button" id="load-more" class="load-more-btn" hidden>
        <span data-i18n="map.load_more_btn">もっと見る</span>
      </button>
    </div>

    <script type="module">
      import { t, applyI18n, initLangSwitcher } from "./i18n.js";
      import { getUserId } from "./auth.js";

      applyI18n();
      initLangSwitcher();

      const $ = (id) => document.getElementById(id);
      const userId = getUserId();

      const LANG_LABEL = {
        "ja-en": t("common.pair_label_en"),
        "ja-zh": t("common.pair_label_zh"),
        "ja-ko": t("common.pair_label_ko"),
        "ja-fr": t("common.pair_label_fr"),
        "ja-es": t("common.pair_label_es"),
        "ja-hi": t("common.pair_label_hi"),
      };

      const jstLocale = {
        ja: "ja-JP",
        en: "en-US",
        zh: "zh-CN",
        fr: "fr-FR",
        es: "es-ES",
        ko: "ko-KR",
      };
      const jst = (ts) =>
        ts
          ? new Date(ts * 1000).toLocaleDateString(
              jstLocale[document.documentElement.lang] || "ja-JP",
              {
                timeZone: "Asia/Tokyo",
                year: "numeric",
                month: "numeric",
                day: "numeric",
              },
            )
          : "—";

      const googleMapsUrl = (lat, lng) =>
        `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

      // ステータス別の色・ラベル。ピン・カードバッジ・凡例・フィルタで単一の情報源にする。
      const STATUS_STYLE = {
        pending_judgment: {
          color: "#c9a227",
          label: t("map.status_reviewing"),
        },
        needs_fix: { color: "#c9a227", label: t("map.status_fix_proposed") },
        looks_ok: { color: "#8a8478", label: t("map.status_looks_ok") },
        confirmed: { color: "#2e6da4", label: t("map.status_confirmed") },
        adopted: { color: "#1a4d73", label: t("map.status_adopted") },
      };
      const PIN_DEFAULT_COLOR = "#8a8478";

      for (const [k, s] of Object.entries(STATUS_STYLE)) {
        $("pin-legend").insertAdjacentHTML(
          "beforeend",
          `<div class="sw"><i class="dot" style="background:${s.color}"></i>${s.label}</div>`,
        );
        $("status-filters").insertAdjacentHTML(
          "beforeend",
          `<label><input type="checkbox" value="${k}" checked>${s.label}</label>`,
        );
      }

      for (const [k, label] of Object.entries(LANG_LABEL)) {
        $("lang-filters").insertAdjacentHTML(
          "beforeend",
          `<label><input type="checkbox" value="${k}" checked>${label}</label>`,
        );
      }

      let leafletPromise = null;
      function loadLeaflet() {
        if (leafletPromise) return leafletPromise;
        leafletPromise = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
          s.onload = resolve;
          s.onerror = () => reject(new Error(t("common.map_load_error")));
          document.head.appendChild(s);
        });
        return leafletPromise;
      }

      function setStatus(text) {
        $("status-msg").textContent = text || "";
      }

      function closeDropdowns() {
        $("search").classList.remove("open");
        $("legend").classList.remove("open");
        $("search-toggle").classList.remove("active");
        $("legend-toggle").classList.remove("active");
      }
      function toggleDropdown(panelId, btnId) {
        const opening = !$(panelId).classList.contains("open");
        closeDropdowns();
        if (opening) {
          $(panelId).classList.add("open");
          $(btnId).classList.add("active");
        }
      }
      $("search-toggle").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleDropdown("search", "search-toggle");
      });
      $("legend-toggle").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleDropdown("legend", "legend-toggle");
      });
      document
        .querySelectorAll(".dropdown")
        .forEach((el) =>
          el.addEventListener("click", (e) => e.stopPropagation()),
        );
      document.addEventListener("click", closeDropdowns);

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      async function main() {
        await loadLeaflet();

        const map = L.map("map", { zoomControl: false }).setView(
          [35.681, 139.767],
          10,
        );
        L.control.zoom({ position: "topright" }).addTo(map);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
        }).addTo(map);

        const dataLayer = L.layerGroup().addTo(map);
        const layersById = new Map();

        function confirmedPinHtml(p, latlng) {
          const photo = p.src_thumb_key
            ? `<img class="popup-photo" src="/img/${p.src_thumb_key}" alt="${escapeHtml(t("common.alt_translated"))}">`
            : "";
          return `${photo}<table>
        <tr><td>${t("map.row_status")}</td><td>${escapeHtml((STATUS_STYLE[p.status] || {}).label || p.status)}</td></tr>
        <tr><td>${t("map.row_lang")}</td><td>${LANG_LABEL[p.lang_pair] || p.lang_pair}</td></tr>
        <tr><td>${t("map.row_original")}</td><td>${escapeHtml(p.original_text || t("map.not_entered"))}</td></tr>
        <tr><td>${t("map.label_confirmed_translation")}</td><td>${escapeHtml(p.translated_text || t("map.not_entered"))}</td></tr>
        <tr><td>${t("map.row_date")}</td><td>${jst(p.event_at)}</td></tr>
      </table>
      ${p.explanation ? `<p class="popup-explanation">${escapeHtml(p.explanation)}</p>` : ""}
      <div class="popup-like-row">
        <button type="button" class="popup-like-btn" id="like-btn-${p.id}">👍 ${t("map.like_btn")}</button>
        <span id="like-count-${p.id}">${p.like_count}</span>
      </div>
      <p style="margin:8px 0 0"><a href="${googleMapsUrl(latlng.lat, latlng.lng)}"
        target="_blank" rel="noopener">${t("map.goto_link")}</a></p>`;
        }

        const REVIEWABLE = new Set(["ja-en", "ja-zh", "ja-ko"]);
        function pendingPinHtml(p, latlng) {
          let cta = "";
          if (REVIEWABLE.has(p.lang_pair)) {
            if (p.status === "pending_judgment") {
              cta = `<a class="popup-cta" href="judge.html?lang_pair=${encodeURIComponent(p.lang_pair)}">${t("map.goto_judge_cta")}</a>`;
            } else if (p.status === "needs_fix") {
              cta = `<a class="popup-cta" href="curate.html?lang_pair=${encodeURIComponent(p.lang_pair)}">${t("map.goto_curate_cta")}</a>`;
            }
          }
          return `<table>
        <tr><td>${t("map.row_status")}</td><td>${escapeHtml((STATUS_STYLE[p.status] || {}).label || p.status)}</td></tr>
        <tr><td>${t("map.row_lang")}</td><td>${LANG_LABEL[p.lang_pair] || p.lang_pair}</td></tr>
        <tr><td>${t("map.row_original")}</td><td>${escapeHtml(p.original_text || t("map.not_entered"))}</td></tr>
        <tr><td>${t("map.label_unconfirmed_translation")}</td><td>${escapeHtml(p.translated_text || t("map.not_entered"))}</td></tr>
        <tr><td>${t("map.row_date")}</td><td>${jst(p.event_at)}</td></tr>
      </table>
      ${cta}
      <p style="margin:8px 0 0"><a href="${googleMapsUrl(latlng.lat, latlng.lng)}"
        target="_blank" rel="noopener">${t("map.goto_link")}</a></p>`;
        }

        function wireLikeButton(popup, p) {
          const btn = document.getElementById(`like-btn-${p.id}`);
          if (!btn) return;
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            try {
              const res = await fetch("/api/posts/like", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ user_id: userId, post_id: p.id }),
              });
              const j = await res.json();
              if (!j.ok) throw new Error(j.error);
              p.like_count = j.count;
              btn.classList.toggle("liked", j.liked);
              const countEl = document.getElementById(`like-count-${p.id}`);
              if (countEl) countEl.textContent = j.count;
            } catch {
              /* 失敗しても地図の閲覧自体は継続できる */
            } finally {
              btn.disabled = false;
            }
          });
        }

        function openPinPopup(p, latlng) {
          const isConfirmed = p.status === "confirmed" || p.status === "adopted";
          const popup = L.popup({ maxWidth: 280 })
            .setLatLng(latlng)
            .setContent(
              isConfirmed ? confirmedPinHtml(p, latlng) : pendingPinHtml(p, latlng),
            )
            .openOn(map);
          if (isConfirmed) wireLikeButton(popup, p);
        }

        function addPinToMap(feature) {
          const p = feature.properties;
          const latlng = L.latLng(
            feature.geometry.coordinates[1],
            feature.geometry.coordinates[0],
          );
          const layer = L.circleMarker(latlng, {
            radius: 7,
            fillColor: (STATUS_STYLE[p.status] || {}).color || PIN_DEFAULT_COLOR,
            fillOpacity: 1,
            color: "#fff",
            weight: 1.5,
          });
          layer.on("click", (e) => openPinPopup(p, e.latlng));
          layer.addTo(dataLayer);
          layersById.set(p.id, layer);
        }

        function cardHtml(feature) {
          const p = feature.properties;
          const style = STATUS_STYLE[p.status] || {};
          const langLabel = LANG_LABEL[p.lang_pair] || p.lang_pair;
          const thumb = p.src_thumb_key
            ? `<img src="/img/${p.src_thumb_key}" alt="">`
            : `<span class="ph-icon">📍</span>`;
          return `
            <div class="post-card" data-id="${p.id}">
              <div class="post-card-thumb">
                ${thumb}
              </div>
              <div class="post-card-body">
                <div class="post-card-badges">
                  <span class="post-card-lang">${escapeHtml(langLabel)}</span>
                  <span class="post-card-status" style="background:${style.color || PIN_DEFAULT_COLOR}">${escapeHtml(style.label || p.status)}</span>
                </div>
                <div class="post-card-text">${escapeHtml(p.original_text || t("map.not_entered"))}</div>
                <div class="post-card-date">${jst(p.event_at)}</div>
              </div>
            </div>
          `;
        }

        function addCard(feature) {
          $("list-items").insertAdjacentHTML("beforeend", cardHtml(feature));
        }

        $("list-items").addEventListener("click", (e) => {
          const card = e.target.closest(".post-card");
          if (!card) return;
          const layer = layersById.get(card.dataset.id);
          if (!layer) return;
          map.setView(layer.getLatLng(), Math.max(map.getZoom(), 15), {
            animate: false,
          });
          layer.fire("click", { latlng: layer.getLatLng() });
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        function checkedValues(containerId) {
          return [
            ...document.querySelectorAll(`#${containerId} input:checked`),
          ].map((el) => el.value);
        }

        let lastQueryBbox = null;
        let offset = 0;
        let lastSearchedCenter = null;
        let lastSearchedZoom = null;
        let controller = null;

        async function runQuery(reset) {
          if (controller) controller.abort();
          controller = new AbortController();

          if (reset) {
            lastQueryBbox = map.getBounds();
            offset = 0;
          }
          if (!lastQueryBbox) return;

          const langs = checkedValues("lang-filters");
          const statuses = checkedValues("status-filters");
          const minLikes = Math.max(0, Number($("min-likes").value) || 0);
          const minAgree = Math.max(0, Number($("min-agree").value) || 0);
          const b = lastQueryBbox;
          const params = new URLSearchParams({
            bbox: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(
              ",",
            ),
            level: "mesh3",
            lang_pair: langs.join(","),
            status: statuses.join(","),
            min_likes: String(minLikes),
            min_agree: String(minAgree),
            limit: "30",
            offset: String(offset),
          });

          setStatus(t("common.loading"));
          try {
            const res = await fetch(`/api/map?${params}`, {
              signal: controller.signal,
            });
            const geojson = await res.json();
            if (!res.ok)
              throw new Error(geojson.error || t("common.fetch_error"));

            const pins = geojson.features.filter(
              (f) => f.properties.kind === "pin",
            );

            if (reset) {
              dataLayer.clearLayers();
              layersById.clear();
              $("list-items").innerHTML = "";
            }
            for (const f of pins) {
              addPinToMap(f);
              addCard(f);
            }
            offset += pins.length;
            $("load-more").hidden = !geojson.has_more;
            if (reset) {
              $("list-empty").hidden = pins.length > 0;
              lastSearchedCenter = map.getCenter();
              lastSearchedZoom = map.getZoom();
              $("search-area-btn").hidden = true;
            }
            setStatus("");
          } catch (e) {
            if (e.name === "AbortError") return;
            setStatus(e.message);
          }
        }

        let debounceTimer = null;
        function scheduleRefresh() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => runQuery(true), 300);
        }
        document
          .querySelectorAll("#lang-filters input, #status-filters input")
          .forEach((el) => el.addEventListener("change", scheduleRefresh));
        $("min-likes").addEventListener("input", scheduleRefresh);
        $("min-agree").addEventListener("input", scheduleRefresh);

        // 地図のパン/ズームでは自動再検索しない(地図情報はフィルタとして使う)。
        // 最後に検索した位置から動いたら「この範囲を検索」ボタンだけ出す。
        const MOVE_THRESHOLD_M = 400;
        map.on("moveend", () => {
          if (!lastSearchedCenter) return;
          const moved =
            map.getZoom() !== lastSearchedZoom ||
            map.getCenter().distanceTo(lastSearchedCenter) > MOVE_THRESHOLD_M;
          $("search-area-btn").hidden = !moved;
        });
        $("search-area-btn").addEventListener("click", () => runQuery(true));

        $("load-more").addEventListener("click", () => runQuery(false));

        async function searchPlace() {
          const q = $("place-q").value.trim();
          const msg = $("place-msg");
          msg.textContent = "";
          if (!q) return;
          msg.textContent = t("map.searching");
          try {
            const res = await fetch(
              `https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`,
            );
            if (!res.ok) throw new Error(t("map.search_failed"));
            const results = await res.json();
            if (!results.length) {
              msg.textContent = t("map.not_found");
              return;
            }
            const [lng, lat] = results[0].geometry.coordinates;
            map.once("moveend", () => runQuery(true));
            map.flyTo([lat, lng], Math.max(map.getZoom(), 14));
            msg.textContent = "";
          } catch (e) {
            msg.textContent = e.message;
          }
        }
        $("place-go").addEventListener("click", searchPlace);
        $("place-q").addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            searchPlace();
          }
        });

        runQuery(true);
      }

      main().catch((e) => setStatus(e.message));
    </script>
  </body>
</html>
