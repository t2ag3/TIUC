<!doctype html>
<html lang="ja" class="app-html">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <title data-i18n="menu.title">メニュー - TIUC</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --app-line: #e3e6df;
      --app-muted: #6b7068;
      --app-text: #1d211d;
      --warn: #a33;
      --ok: #161;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
      color: var(--app-text);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 6px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .lead {
      color: var(--app-muted);
      font-size: 14px;
      margin: 0 0 22px;
      line-height: 1.75;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .tile {
      grid-column: span 1;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-align: center;
      border: 1px solid var(--app-line);
      border-radius: 22px;
      text-decoration: none;
      color: inherit;
      padding: 12px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow:
        0 1px 2px rgba(18, 28, 20, 0.04),
        0 10px 30px rgba(18, 28, 20, 0.05);
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }
    .tile:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 34px rgba(18, 28, 20, 0.09);
    }
    .tile .tile-icon {
      font-size: 34px;
      line-height: 1;
    }
    .tile .tile-title {
      font-size: 15px;
      font-weight: 800;
    }
    .tile .tile-desc {
      font-size: 11px;
      color: var(--app-muted);
    }
    .tile.primary {
      background: #1d603e;
      border-color: #1d603e;
      color: #fff;
    }
    .tile.primary .tile-desc {
      color: #cfe3d8;
    }
    .tile.map-accent {
      background: #214f69;
      border-color: #214f69;
      color: #fff;
    }
    .tile.map-accent .tile-desc {
      color: #cfe0ea;
    }
    .tile-bar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--app-line);
      border-radius: 999px;
      padding: 12px 18px;
      text-decoration: none;
      color: var(--app-muted);
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.7);
      transition:
        border-color 0.15s ease,
        background 0.15s ease;
    }
    .tile-bar:hover {
      border-color: #b9c3ba;
      background: #fff;
    }
    .tile-bar .tile-bar-icon {
      font-size: 15px;
    }
    footer {
      margin-top: 30px;
      font-size: 11px;
      color: #8a8f88;
      line-height: 1.7;
    }
    .stats {
      font-size: 13px;
      color: var(--app-muted);
      margin: -10px 0 20px;
    }
    .stats strong {
      color: var(--app-text);
      font-size: 15px;
    }
  </style>
  <body class="app-body">
    <div class="app-shell">
      <header class="app-topbar">
        <a href="/" class="brand" data-i18n-aria-label="index.brand_aria"
          ><span class="brand-mark">T</span
          ><span class="brand-copy"
            ><strong>TIUC</strong
            ><span data-i18n="menu.back_top_full">← トップに戻る</span></span
          ></a
        >
        <select id="lang-switcher" class="lang-switcher"></select>
      </header>
      <h1 data-i18n="menu.h1">キュレーションモード</h1>
      <p class="lead" data-i18n="menu.lead">
        投稿された外国語表記を評価・修正します。ここだけが「属性(能力)」で中身が変わりますが、
        素養がなくても練習として参加できます。まずは違和感チェックからどうぞ。
      </p>

      <p class="stats" id="stats" hidden></p>

      <div class="grid">
        <a class="tile primary" href="judge.html">
          <span class="tile-icon">🔍</span>
          <span class="tile-title" data-i18n="common.label_judgment_check"
            >違和感チェック</span
          >
          <span class="tile-desc" data-i18n="menu.tile_judge_desc"
            >訳文言語のネイティブ向け・一タップ</span
          >
        </a>
        <a class="tile map-accent" href="curate.html">
          <span class="tile-icon">✏️</span>
          <span class="tile-title" data-i18n="menu.tile_curate_title"
            >修正・投票</span
          >
          <span class="tile-desc" data-i18n="menu.tile_curate_desc"
            >バイリンガル向け・正誤判定</span
          >
        </a>
        <a class="tile-bar" href="report.html">
          <span class="tile-bar-icon">📷</span>
          <span data-i18n="menu.tile_report"
            >撮影投稿モードへ(新しい表記を投稿する)</span
          >
        </a>
      </div>

      <footer data-i18n="menu.footer">
        ログイン不要・匿名で利用できます。
      </footer>
    </div>
    <script type="module">
      import { t, applyI18n, initLangSwitcher } from "./i18n.js";
      import "./track.js";
      applyI18n();
      initLangSwitcher();
      fetch("/api/health")
        .then((r) => r.json())
        .then((j) => {
          if (!j.ok) return;
          const el = document.getElementById("stats");
          el.innerHTML = j.needs_fix
            ? t("menu.stats_line_with_fix", {
                total: j.total,
                needs_fix: j.needs_fix,
              })
            : t("menu.stats_line_plain", { total: j.total });
          el.hidden = false;
        })
        .catch(() => {}); // 取得に失敗してもページ自体は問題なく表示する
    </script>
  </body>
</html>
