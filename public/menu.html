<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="menu.title">メニュー - TIUC</title>
<link rel="stylesheet" href="tokens.css">
<style>
  :root { --line:#ddd; --muted:#666; --warn:#a33; --ok:#161; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0 auto; padding: 16px;
         max-width: 520px; line-height: 1.6; color: #222; }
  #topbar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .back { font-size: 12px; color: var(--muted); text-decoration: none; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .lead { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { grid-column: span 1; aspect-ratio: 1 / 1; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 6px; text-align: center;
          border: 1px solid var(--line); border-radius: 16px; text-decoration: none;
          color: inherit; padding: 12px; }
  .tile:hover { border-color: #333; background: #f4f4f2; }
  .tile .tile-icon { font-size: 34px; line-height: 1; }
  .tile .tile-title { font-size: 15px; font-weight: 600; }
  .tile .tile-desc { font-size: 11px; color: var(--muted); }
  .tile.primary { background: #1a5c3a; border-color: #1a5c3a; color: #fff; }
  .tile.primary .tile-desc { color: #cfe3d8; }
  .tile.primary:hover { background: #164a30; }
  .tile.map-accent { background: #1a4d73; border-color: #1a4d73; color: #fff; }
  .tile.map-accent .tile-desc { color: #cfe0ea; }
  .tile.map-accent:hover { background: #163f5e; }
  .tile-bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px;
              border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px;
              text-decoration: none; color: var(--muted); font-size: 13px; }
  .tile-bar:hover { border-color: #333; background: #f4f4f2; }
  .tile-bar .tile-bar-icon { font-size: 15px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  .stats { font-size: 13px; color: var(--muted); margin: -12px 0 20px; }
  .stats strong { color: #222; font-size: 15px; }
</style>
<body>

<div id="topbar">
  <a class="back" href="/" data-i18n="menu.back_top_full">← トップに戻る</a>
  <select id="lang-switcher" class="lang-switcher"></select>
</div>
<h1 data-i18n="menu.h1">キュレーションモード</h1>
<p class="lead" data-i18n="menu.lead">
  投稿された外国語表記を評価・修正します。ここだけが「属性(能力)」で中身が変わりますが、
  素養がなくても練習として参加できます。まずは違和感チェックからどうぞ。
</p>

<p class="stats" id="stats" hidden></p>

<div class="grid">
  <a class="tile primary" href="judge.html">
    <span class="tile-icon">🔍</span>
    <span class="tile-title" data-i18n="common.label_judgment_check">違和感チェック</span>
    <span class="tile-desc" data-i18n="menu.tile_judge_desc">訳文言語のネイティブ向け・一タップ</span>
  </a>
  <a class="tile map-accent" href="curate.html">
    <span class="tile-icon">✏️</span>
    <span class="tile-title" data-i18n="menu.tile_curate_title">修正・投票</span>
    <span class="tile-desc" data-i18n="menu.tile_curate_desc">バイリンガル向け・正誤判定</span>
  </a>
  <a class="tile-bar" href="report.html">
    <span class="tile-bar-icon">📷</span>
    <span data-i18n="menu.tile_report">撮影投稿モードへ(新しい表記を投稿する)</span>
  </a>
  <a class="tile-bar" href="mypage.html">
    <span class="tile-bar-icon">👤</span>
    <span data-i18n="menu.tile_mypage">マイページ(貢献履歴・ポイント)</span>
  </a>
</div>

<footer data-i18n="menu.footer">ログイン不要・匿名で利用できます。</footer>

<script type="module">
import { t, applyI18n, initLangSwitcher } from './i18n.js';
applyI18n();
initLangSwitcher();
fetch('/api/health').then((r) => r.json()).then((j) => {
  if (!j.ok) return;
  const el = document.getElementById('stats');
  el.innerHTML = j.needs_fix
    ? t('menu.stats_line_with_fix', { total: j.total, needs_fix: j.needs_fix })
    : t('menu.stats_line_plain', { total: j.total });
  el.hidden = false;
}).catch(() => {}); // 取得に失敗してもページ自体は問題なく表示する
</script>

</body>
</html>
