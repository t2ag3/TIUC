name: Deploy to Cloudflare Workers

# 【保留中】Cloudflare APIトークンが発行できないため、いまは眠らせています。
# 主催者提供のアカウントで私たちのロールではトークンを作れず、
# CLOUDFLARE_API_TOKEN が無いので実行しても認証エラーで落ちます。
# 事務局からアカウント所有のトークンをもらえたら、
#   1. Secret に CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID を登録
#   2. 下の on: を次に戻す
#        on:
#          push:
#            branches: [main]
#          workflow_dispatch:
# それまでは手動で `npx wrangler deploy`（必ず main から）。
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ここが本番への最後のゲート。
      # main への直接 push を許可しているぶん、レビューの代わりにこれが守る。
      # 落ちたら以降のステップは実行されず、本番は無傷のまま。
      - name: Type check (gate)
        run: npx tsc --noEmit

      # 本番D1にマイグレーションを適用してから deploy する。
      # 「DBには列があるがコードは知らない」「その逆」を構造的に防ぐため、
      # migration → deploy の順序をここで固定している。
      - name: Apply D1 migrations (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply tiuc-db --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Summary
        run: |
          echo "### デプロイ完了" >> $GITHUB_STEP_SUMMARY
          echo "コミット: \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "https://tiuc.tokyo-odh-135.workers.dev" >> $GITHUB_STEP_SUMMARY
