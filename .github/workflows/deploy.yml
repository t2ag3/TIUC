name: Deploy to Cloudflare Workers

# main が更新されたら走る。PR経由でも直接 push でも同じ。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ここが本番への最後のゲート。
      # main への直接 push を許可しているぶん、レビューの代わりにこれが守る。
      # 落ちたら以降のステップは実行されず、本番は無傷のまま。
      - name: Type check (gate)
        run: npx tsc --noEmit

      # 本番D1にマイグレーションを適用してから deploy する。
      # 「DBには列があるがコードは知らない」「その逆」を構造的に防ぐため、
      # migration → deploy の順序をここで固定している。
      - name: Apply D1 migrations (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply tiuc-db --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Summary
        run: |
          echo "### デプロイ完了" >> $GITHUB_STEP_SUMMARY
          echo "コミット: \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "https://tiuc.tokyo-odh-135.workers.dev" >> $GITHUB_STEP_SUMMARY
